<template>
    <section class={experienceClass} data-experience={screenId} aria-label={routeTitle}>
        <header class="experience-header">
            <div><p class="experience-kicker">{routeLabel}</p><h2>{routeTitle}</h2><p>{routeDescription}</p></div>
            <div class="header-context"><span class="role-chip master-role-chip">{activeRole}</span><template lwc:if={isPortfolio}><div class="source-badge"><span>Project book</span><strong>{projectRows.length} records in scope</strong><small>Salesforce user-mode · {generatedLabel}</small></div></template><template lwc:else><lightning-combobox class="project-picker" data-recording-action="project-picker" label="Selected project" value={activeEngagementId} options={projectOptions} onchange={handleProjectPicker}></lightning-combobox></template></div>
        </header>

        <template lwc:if={isPortfolio}>
            <div class="portfolio-toolbar"><div class="search-box"><lightning-icon icon-name="utility:search" size="x-small"></lightning-icon><lightning-input data-recording-action="project-search" type="search" variant="label-hidden" label="Search projects" placeholder="Search project, account, industry or tower" value={projectSearch} onchange={handleProjectSearch}></lightning-input></div><lightning-combobox data-recording-action="project-status" label="Lifecycle state" value={projectStatus} options={projectStatusOptions} onchange={handleProjectStatus}></lightning-combobox><div class="portfolio-legend"><span class="legend-good">Healthy</span><span class="legend-watch">Watch</span><span class="legend-risk">At risk</span></div></div>
            <div class="portfolio-layout">
                <div class="project-grid" aria-label="Filtered engagement portfolio"><template for:each={projectRows} for:item="project"><button key={project.id} class={project.className} data-record-id={project.id} data-recording-action="select-project" onclick={handleSelectProject}><header><span>{project.Engagement_ID__c}</span><small>{project.Status__c}</small></header><h3>{project.Name}</h3><p>{project.account}</p><div class="project-context"><span>{project.Salesforce_Tower__c}</span><span>{project.Industry__c}</span></div><div class="progress-track"><span style={project.progressStyle}></span></div><footer><div><small>Complete</small><strong>{project.completion}</strong></div><div><small>Health</small><strong>{project.healthLabel}</strong></div><div><small>Risk</small><strong>{project.riskLabel}</strong></div></footer></button></template><template lwc:if={hasProjectRows}></template><template lwc:else><div class="empty-state">No project matches the active filters.</div></template></div>
                <aside class="project-preview" aria-live="polite"><div class="preview-status"><span>{selectedProjectView.Status__c}</span><strong>{selectedProjectView.completion} complete</strong></div><p>{selectedProjectView.Engagement_ID__c}</p><h3>{selectedProjectView.Name}</h3><span>{selectedProjectView.account}</span><dl><div><dt>Portfolio</dt><dd>{selectedProjectView.portfolio}</dd></div><div><dt>Sub-portfolio</dt><dd>{selectedProjectView.subPortfolio}</dd></div><div><dt>Project manager</dt><dd>{selectedProjectView.manager}</dd></div><div><dt>Delivery window</dt><dd>{selectedProjectView.start} → {selectedProjectView.end}</dd></div></dl><div class="preview-progress"><div style={selectedProjectView.progressStyle}></div></div><lightning-button data-recording-action="open-project-360" variant="brand" label="Open selected Project 360" onclick={handleOpenProject360} disabled={selectedProjectView.disabled}></lightning-button></aside>
            </div>
        </template>

        <template lwc:if={isProject360}>
            <section class="project-hero"><div class="project-identity"><span>{selectedProjectCode}</span><h3>{selectedProjectName}</h3><p>{selectedProjectView.account} · {selectedProjectView.Industry__c}</p><div class="hero-progress"><span style={selectedProjectView.progressStyle}></span></div><small>{selectedProjectView.completion} delivered · {selectedProjectView.Lifecycle_Stage__c}</small></div><div class="project-facts"><template for:each={projectHeroFacts} for:item="fact"><article key={fact.id}><span>{fact.label}</span><strong>{fact.value}</strong><p>{fact.detail}</p></article></template></div></section>
            <div class="commercial-layout"><section class="commercial-lineage"><div class="section-title"><div><p>Commercial lineage</p><h3>Contract and change-order chain</h3></div><span>{commercialReferences.length} references</span></div><div class="commercial-list"><template for:each={commercialReferences} for:item="reference"><button key={reference.id} class={reference.className} data-record-id={reference.id} data-recording-action="select-commercial" onclick={handleSelectCommercial}><div><span>{reference.type}</span><small>v{reference.Version__c}</small></div><strong>{reference.Name}</strong><p>{reference.valueLabel} · signed {reference.signedLabel}</p><footer><span>{reference.Approval_Status__c}</span><small>{reference.Status__c}</small></footer></button></template></div></section><aside class="commercial-detail" aria-live="polite"><div class="detail-banner"><span>{selectedCommercialView.type}</span><strong>{selectedCommercialView.status}</strong></div><h3>{selectedCommercialView.title}</h3><div class="commercial-kpis"><article><span>Contract value</span><strong>{selectedCommercialView.valueLabel}</strong></article><article><span>Approval</span><strong>{selectedCommercialView.approval}</strong></article><article><span>Signed</span><strong>{selectedCommercialView.signedLabel}</strong></article><article><span>Validity</span><strong>{selectedCommercialView.validity}</strong></article></div><h4>Accepted commercial lines</h4><div class="commercial-lines"><template for:each={commercialLines} for:item="line"><article key={line.id}><div><strong>{line.Description__c}</strong><span>{line.Line_Type__c} · {line.Status__c}</span></div><div><strong>{line.valueLabel}</strong><span>{line.acceptance} · {line.deliveryLabel}</span></div></article></template><template lwc:if={hasCommercialLines}></template><template lwc:else><p>No line items are readable for the selected reference.</p></template></div><lightning-button data-recording-action="drill-work-plan" variant="brand" label="Drill into accepted work plan" onclick={handleOpenCommercialLine} disabled={selectedCommercialView.disabled}></lightning-button></aside></div>
        </template>

        <template lwc:if={isRoster}>
            <div class="roster-toolbar"><div><p>Current accepted allocations</p><h3>{selectedProjectName} delivery team</h3></div><lightning-input data-recording-action="roster-search" type="search" label="Practitioner or role" placeholder="Search practitioner, role or work unit" value={rosterSearch} onchange={handleRosterSearch}></lightning-input><lightning-combobox data-recording-action="classification-filter" label="Classification" value={rosterClassification} options={rosterClassificationOptions} onchange={handleRosterClassification}></lightning-combobox></div>
            <div class="roster-layout"><div class="roster-board"><div class="roster-head"><span>Practitioner</span><span>Role and work unit</span><span>Capacity</span><span>Control</span></div><template for:each={rosterRows} for:item="person"><button key={person.id} class={person.className} data-record-id={person.id} data-recording-action="select-roster" onclick={handleSelectRoster}><div><span class="avatar">{person.resource}</span><strong>{person.resource}</strong></div><div><strong>{person.Role__c}</strong><span>{person.workUnit}</span></div><div><strong>{person.hoursLabel}</strong><span>{person.utilization}</span></div><div><strong>{person.Capacity_Status__c}</strong><span>{person.Classification__c}</span></div></button></template></div><aside class="resource-drawer" aria-live="polite"><div class="drawer-avatar"><lightning-icon icon-name="standard:people" size="medium"></lightning-icon></div><p>Selected allocation</p><h3>{selectedRosterView.resource}</h3><span>{selectedRosterView.role} · {selectedRosterView.classification}</span><div class="capacity-gauge"><strong>{selectedRosterView.projected}</strong><span>{selectedRosterView.capacity}</span></div><dl><div><dt>Project line</dt><dd>{selectedRosterView.hoursLabel}</dd></div><div><dt>Effective window</dt><dd>{selectedRosterView.window}</dd></div><div><dt>Over-allocation control</dt><dd>{selectedRosterView.approval}</dd></div><div><dt>Skills evidence</dt><dd>{selectedRosterView.evidence}</dd></div></dl><lightning-button data-recording-action="open-resource-360" variant="brand" label="Open practitioner Resource 360" onclick={handleOpenResource360} disabled={selectedRosterView.disabled}></lightning-button></aside></div>
        </template>

        <template lwc:if={isEconomics}>
            <div class="economics-layout"><aside class="budget-list"><div class="budget-list-head"><div><p>Budget versions</p><h3>Current economics</h3></div><lightning-combobox data-recording-action="budget-state" label="Approval state" variant="label-hidden" value={budgetState} options={budgetStateOptions} onchange={handleBudgetState}></lightning-combobox></div><template for:each={budgetRows} for:item="budget"><button key={budget.id} class={budget.className} data-record-id={budget.id} data-recording-action="select-budget" onclick={handleSelectBudget}><div><span>v{budget.Version__c}</span><strong>{budget.State__c}</strong></div><h4>{budget.Name}</h4><p>{budget.revenueLabel} revenue · {budget.marginLabel} margin</p><footer>Approval step {budget.Approval_Step__c} · {budget.Policy_Version__c}</footer></button></template></aside><section class="economics-board" aria-live="polite"><div class="economics-heading"><div><p>{budgetView.Name}</p><h3>{budgetView.State__c} economics</h3></div><span>Current v{budgetView.Version__c}</span></div><div class="economics-kpis"><article><span>Revenue</span><strong>{budgetView.revenue}</strong><small>Approved commercial cover</small></article><article><span>Total cost</span><strong>{budgetView.cost}</strong><small>{budgetView.plannedHours} planned hours</small></article><article><span>Gross margin</span><strong>{budgetView.margin}</strong><small>Forecast {budgetView.forecastMargin}</small></article><article><span>EAC / ETC</span><strong>{budgetView.eac}</strong><small>{budgetView.etc} to complete</small></article></div><div class="margin-compare"><div><span>Approved margin</span><div><b style={budgetView.marginStyle}></b></div><strong>{budgetView.margin}</strong></div><div><span>Forecast margin</span><div><b style={budgetView.forecastStyle}></b></div><strong>{budgetView.forecastMargin}</strong></div></div><div class="costed-roster"><header><span>Practitioner / role</span><span>Phase</span><span>Planned hours</span><span>Planned cost</span></header><template for:each={selectedBudgetLines} for:item="line"><article key={line.id}><span>{line.resource}<small>{line.Role__c}</small></span><span>{line.Phase__c}<small>{line.Work_Unit__c}</small></span><strong>{line.hours}</strong><strong>{line.cost}</strong></article></template></div><div class="evidence-bar"><span role="status">{budgetEvidenceOutcome}</span><lightning-button data-recording-action="budget-evidence" variant="brand" label="Review approval evidence" onclick={handleBudgetEvidence} disabled={budgetView.disabled}></lightning-button></div></section></div>
        </template>

        <template lwc:if={isActuals}>
            <div class="actuals-toolbar"><div><p>Weekly actuals</p><h3>Timesheet-to-project reconciliation</h3></div><div class="actuals-policy"><span>Daily entry cap</span><strong>8 hours</strong></div><lightning-combobox data-recording-action="timesheet-state" label="Timesheet state" value={timesheetState} options={timesheetStateOptions} onchange={handleTimesheetState}></lightning-combobox></div>
            <div class="actuals-layout"><section class="timesheet-list"><div class="timesheet-head"><span>Practitioner</span><span>Week</span><span>Actuals</span><span>State</span></div><template for:each={timesheetRows} for:item="sheet"><button key={sheet.id} class={sheet.className} data-record-id={sheet.id} data-recording-action="select-timesheet" onclick={handleSelectTimesheet}><strong>{sheet.resource}</strong><span>{sheet.weekLabel}</span><b>{sheet.hours}</b><span>{sheet.Status__c}<small>{sheet.exception}</small></span></button></template></section><aside class="actuals-detail" aria-live="polite"><div class="actuals-summary"><div><span>{timesheetView.week}</span><h3>{timesheetView.resource}</h3></div><strong>{timesheetView.hours}</strong></div><div class="actuals-state"><span>{timesheetView.status}</span><small>{timesheetView.approval}</small></div><div class="daily-actuals"><template for:each={selectedTimesheetEntries} for:item="entry"><article key={entry.id} class={entry.className}><span>{entry.date}</span><strong>{entry.hours}</strong><small>{entry.Role__c} · {entry.State__c}</small></article></template></div><div class="validation-outcome" role="status"><lightning-icon icon-name="utility:shield" size="x-small"></lightning-icon><span>{timesheetView.outcome}</span></div><lightning-button data-recording-action="validate-actuals" variant="brand" label="Validate eight-hour daily cap" onclick={handleValidateActuals} disabled={timesheetView.disabled}></lightning-button></aside></div>
        </template>

        <template lwc:if={isWorkPlan}>
            <div class="work-toolbar"><div><p>Dynamic delivery plan</p><h3>{selectedProjectName} work breakdown</h3></div><lightning-combobox data-recording-action="phase-filter" label="Phase" value={workPhase} options={workPhaseOptions} onchange={handleWorkPhase}></lightning-combobox><lightning-button data-recording-action="critical-path" variant="brand-outline" label={criticalButtonLabel} onclick={handleToggleCritical}></lightning-button></div>
            <div class="work-layout"><section class="timeline-board"><div class="timeline-scale"><span>Discover</span><span>Design</span><span>Build</span><span>Test</span><span>Deploy</span></div><template for:each={workUnitRows} for:item="unit"><button key={unit.id} class={unit.className} data-record-id={unit.id} data-recording-action="select-work-unit" onclick={handleSelectWorkUnit}><div class="unit-sequence"><span>{unit.Sequence__c}</span><small>{unit.Work_Unit_Code__c}</small></div><div class="unit-copy"><strong>{unit.Name}</strong><span>{unit.Phase__c} · {unit.owner}</span></div><div class="unit-dates">{unit.dateRange}</div><div class="unit-progress"><div><span style={unit.progressStyle}></span></div><strong>{unit.completion}</strong></div><div class="unit-control"><span>{unit.Status__c}</span><small>{unit.Critical_Path__c}</small></div></button></template></section><aside class="work-detail" aria-live="polite"><div class="work-detail-code">{selectedWorkUnitView.code}</div><h3>{selectedWorkUnitView.title}</h3><p>{selectedWorkUnitView.phase} · {selectedWorkUnitView.owner}</p><div class="work-detail-grid"><article><span>Schedule</span><strong>{selectedWorkUnitView.window}</strong></article><article><span>Progress</span><strong>{selectedWorkUnitView.completion}</strong></article><article><span>Acceptance</span><strong>{selectedWorkUnitView.acceptance}</strong></article><article><span>Planned effort</span><strong>{selectedWorkUnitView.Planned_Hours__c}h</strong></article></div><div class="dependency-panel"><span>Dependency evidence</span><p>{selectedWorkUnitView.dependency}</p></div><lightning-button data-recording-action="work-risk" variant="brand" label="Inspect related delivery risks" onclick={handleOpenProjectRisks} disabled={selectedWorkUnitView.disabled}></lightning-button></aside></div>
        </template>

        <template lwc:if={isRisks}>
            <div class="risk-toolbar"><div><p>Accountable action register</p><h3>{selectedProjectName} risk board</h3></div><lightning-combobox data-recording-action="risk-severity" label="Severity" value={riskSeverity} options={riskSeverityOptions} onchange={handleRiskSeverity}></lightning-combobox><lightning-combobox data-recording-action="risk-status" label="Status" value={riskStatus} options={riskStatusOptions} onchange={handleRiskStatus}></lightning-combobox></div>
            <div class="risk-layout"><section class="risk-board"><template for:each={riskRows} for:item="risk"><button key={risk.id} class={risk.className} data-record-id={risk.id} data-recording-action="select-risk" onclick={handleSelectRisk}><header><span>{risk.Severity__c}</span><small>{risk.reviewState}</small></header><h3>{risk.title}</h3><p>{risk.Description__c}</p><footer><span>{risk.owner}</span><small>Due {risk.due}</small></footer></button></template></section><aside class="risk-detail" aria-live="polite"><div class="risk-detail-head"><span>{riskView.severity}</span><strong>{riskView.status}</strong></div><h3>{riskView.title}</h3><p>{riskView.description}</p><dl><div><dt>Accountable owner</dt><dd>{riskView.owner}</dd></div><div><dt>Due date</dt><dd>{riskView.due}</dd></div><div><dt>Mitigation</dt><dd>{riskView.mitigation}</dd></div></dl><lightning-button data-recording-action="review-risk" variant="brand" label="Acknowledge accountable action" onclick={handleReviewRisk} disabled={riskView.disabled}></lightning-button></aside></div>
        </template>

        <template lwc:if={isAllocationHistory}>
            <div class="history-toolbar"><div><p>Allocation lineage</p><h3>Effective-dated practitioner history</h3></div><lightning-combobox data-recording-action="history-resource" label="Practitioner" value={activeHistoryResourceId} options={historyResourceOptions} onchange={handleHistoryResource}></lightning-combobox><lightning-button data-recording-action="compare-versions" variant="brand" label="Compare versions" onclick={handleCompareVersions}></lightning-button></div>
            <div class="history-layout"><section class="history-timeline"><div class="history-spine"></div><template for:each={historyRows} for:item="version"><article key={version.id} class={version.className}><div class="history-dot"></div><header><span>{version.versionLabel}</span><strong>{version.currentLabel}</strong></header><h3>{version.Role__c}</h3><p>{version.window}</p><div class="history-facts"><span>{version.hours}</span><span>{version.State__c}</span><span>{version.Capacity_Status__c}</span><span>{version.Classification__c}</span></div><footer>{version.publication}</footer></article></template></section><aside class="history-summary" aria-live="polite"><p>Selected practitioner</p><h3>{historySummary.resource}</h3><span>{historySummary.role}</span><div class="history-kpis"><article><strong>{historySummary.versions}</strong><span>versions</span></article><article><strong>{historySummary.currentHours}</strong><span>current line</span></article><article><strong>{historySummary.capacity}</strong><span>capacity state</span></article></div><div class="comparison-outcome" role="status"><lightning-icon icon-name="utility:compare" size="x-small"></lightning-icon><span>{historySummary.comparison}</span></div><small>Prior versions remain immutable; the current accepted version is the only line consumed by capacity and utilization.</small></aside></div>
        </template>
    </section>
</template>
