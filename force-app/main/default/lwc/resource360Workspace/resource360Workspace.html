<template>
    <article class="workspace">
        <header class="hero">
            <div>
                <p class="eyebrow">EXL Salesforce COE</p>
                <h1>Resource 360</h1>
                <p class="subtitle">Native Salesforce staffing, skills, budgeting, allocation and delivery governance</p>
            </div>
            <div class="hero-actions">
                <lightning-combobox label="Active business role" value={activeRole} options={roleOptions} onchange={handleRole}></lightning-combobox>
                <lightning-button label="Refresh" icon-name="utility:refresh" onclick={loadData}></lightning-button>
                <lightning-button variant="brand" label="Load sanitized demo data" icon-name="utility:database" onclick={handleSeed}></lightning-button>
            </div>
        </header>

        <div class="status-strip">
            <span class="status-pill status-pill_good">Salesforce system of record</span>
            <span>{screenCountLabel}</span>
            <span>Last refreshed {generatedLabel}</span>
        </div>

        <template lwc:if={loading}><lightning-spinner alternative-text="Loading Resource 360"></lightning-spinner></template>
        <template lwc:if={errorMessage}><div class="error-panel" role="alert">{errorMessage}</div></template>

        <div class="layout">
            <aside class="module-rail" aria-label="Resource 360 modules">
                <template for:each={modules} for:item="module">
                    <button key={module.id} class={module.buttonClass} data-module={module.id} onclick={handleModule}>
                        <lightning-icon icon-name={module.icon} size="small" alternative-text=""></lightning-icon>
                        <span>{module.label}</span><strong>{module.count}</strong>
                    </button>
                </template>
                <div class="screen-list">
                    <p class="rail-heading">Screens</p>
                    <template for:each={moduleScreens} for:item="screen">
                        <button key={screen.id} class={screen.buttonClass} data-screen={screen.id} onclick={handleScreen}>
                            <span>{screen.id}</span>{screen.title}
                        </button>
                    </template>
                </div>
            </aside>

            <main class="content">
                <section class="metric-grid" aria-label="Resource 360 summary">
                    <template for:each={summaryCards} for:item="card">
                        <article key={card.label} class="metric-card"><p>{card.label}</p><strong>{card.value}</strong><span>{card.note}</span></article>
                    </template>
                </section>

                <section class="screen-heading">
                    <div class="screen-copy">
                        <div class="screen-meta"><span class="screen-id">{selectedScreen.id}</span><span>{selectedScreen.release}</span><span>{selectedScreen.kind}</span></div>
                        <h2>{selectedScreen.title}</h2>
                        <p>{selectedScreen.description}</p>
                    </div>
                    <div class="screen-context"><span class="role-chip">{activeRole}</span><small>Primary PRD action</small><strong>{selectedScreen.primary}</strong></div>
                </section>

                <template lwc:if={isAuthorized}>
                <section class="contract-panel" aria-label="Governed screen contract">
                    <div class="contract-grid">
                        <div><span>Delivery</span><strong>{selectedScreen.delivery}</strong></div>
                        <div><span>Authorized roles</span><strong>{selectedScreen.roleLabel}</strong></div>
                        <div><span>Field and source ownership</span><strong>{selectedScreen.fields}</strong><p>{selectedScreen.source}</p></div>
                        <div><span>Server contract</span><strong>{selectedScreen.api}</strong><p>{selectedScreen.validations}</p></div>
                        <div><span>Traceability</span><strong>{selectedScreen.requirements}</strong><p>{selectedScreen.events}</p></div>
                        <div><span>Acceptance</span><strong>{selectedScreen.acceptance}</strong></div>
                    </div>
                    <div class="state-row" aria-label="Supported screen states">
                        <template for:each={stateVariants} for:item="state"><span key={state.key}>{state.label}</span></template>
                    </div>
                </section>

                <template lwc:if={showStaffingForm}>
                    <section class="action-panel">
                        <div class="panel-heading"><div><p class="eyebrow">Governed command</p><h3>Create staffing request</h3></div><span>Approved-budget and capacity gates run in Apex</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Engagement" value={staffingDraft.engagementId} options={engagementOptions} data-field="engagementId" onchange={handleStaffingInput} required></lightning-combobox>
                            <lightning-combobox label="Candidate" value={staffingDraft.resourceId} options={resourceOptions} data-field="resourceId" onchange={handleStaffingInput} required></lightning-combobox>
                            <lightning-input label="Salesforce role" value={staffingDraft.requestedRole} data-field="requestedRole" onchange={handleStaffingInput} required></lightning-input>
                            <lightning-combobox label="Classification" value={staffingDraft.classification} options={classificationOptions} data-field="classification" onchange={handleStaffingInput} required></lightning-combobox>
                            <lightning-input type="date" label="Start date" value={staffingDraft.startDate} data-field="startDate" onchange={handleStaffingInput} required></lightning-input>
                            <lightning-input type="date" label="End date" value={staffingDraft.endDate} data-field="endDate" onchange={handleStaffingInput} required></lightning-input>
                            <lightning-input type="number" label="Daily hours" value={staffingDraft.dailyHours} min="0.25" max="24" step="0.25" data-field="dailyHours" onchange={handleStaffingInput} required></lightning-input>
                            <lightning-combobox label="Unbilled control owner" value={staffingDraft.responsibleOwnerId} options={userOptions} data-field="responsibleOwnerId" onchange={handleStaffingInput}></lightning-combobox>
                            <lightning-input type="date" label="Unbilled review date" value={staffingDraft.reviewDate} data-field="reviewDate" onchange={handleStaffingInput}></lightning-input>
                            <lightning-textarea class="form-span" label="Unbilled control reason" value={staffingDraft.controlReason} data-field="controlReason" onchange={handleStaffingInput}></lightning-textarea>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Submit staffing request" onclick={handleCreateStaffing}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showTalentSearch}>
                    <section class="action-panel action-panel_blue">
                        <div class="panel-heading"><div><p class="eyebrow">Explainable matching</p><h3>Search Salesforce talent</h3></div><span>Capability is a hard gate; every weighted score is explained</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Capability" value={talentDraft.capabilityId} options={capabilityOptions} data-field="capabilityId" onchange={handleTalentInput}></lightning-combobox>
                            <lightning-combobox label="Minimum proficiency" value={talentDraft.minimumLevel} options={levelOptions} data-field="minimumLevel" onchange={handleTalentInput}></lightning-combobox>
                            <lightning-input label="Requested role" value={talentDraft.requestedRole} data-field="requestedRole" onchange={handleTalentInput}></lightning-input>
                            <lightning-input label="Tower" value={talentDraft.tower} data-field="tower" onchange={handleTalentInput}></lightning-input>
                            <lightning-input label="Location" value={talentDraft.location} data-field="location" onchange={handleTalentInput}></lightning-input>
                            <lightning-input type="date" label="Start date" value={talentDraft.startDate} data-field="startDate" onchange={handleTalentInput} required></lightning-input>
                            <lightning-input type="date" label="End date" value={talentDraft.endDate} data-field="endDate" onchange={handleTalentInput} required></lightning-input>
                            <lightning-input type="number" label="Daily hours" value={talentDraft.dailyHours} min="0.25" max="24" step="0.25" data-field="dailyHours" onchange={handleTalentInput}></lightning-input>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Rank eligible talent" onclick={handleTalentSearch}></lightning-button></div>
                        <template lwc:if={hasTalentResults}><lightning-datatable key-field="resourceId" data={talentResults} columns={talentColumns} hide-checkbox-column></lightning-datatable></template>
                    </section>
                </template>

                <template lwc:if={showSkillsForm}>
                    <section class="action-panel action-panel_purple">
                        <div class="panel-heading"><div><p class="eyebrow">Manager-reviewed evidence</p><h3>Submit capability claim</h3></div><span>Only approved levels enter talent search</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Practitioner" value={skillDraft.resourceId} options={resourceOptions} data-field="resourceId" onchange={handleSkillInput} required></lightning-combobox>
                            <lightning-combobox label="Capability" value={skillDraft.capabilityId} options={capabilityOptions} data-field="capabilityId" onchange={handleSkillInput} required></lightning-combobox>
                            <lightning-combobox label="Requested proficiency" value={skillDraft.requestedLevel} options={levelOptions} data-field="requestedLevel" onchange={handleSkillInput} required></lightning-combobox>
                            <lightning-input type="number" label="Years of experience" value={skillDraft.yearsExperience} min="0" max="50" step="0.25" data-field="yearsExperience" onchange={handleSkillInput}></lightning-input>
                            <lightning-textarea class="form-span" label="Evidence" value={skillDraft.evidence} data-field="evidence" onchange={handleSkillInput}></lightning-textarea>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Submit capability claim" onclick={handleSubmitClaim}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showCredentialForm}>
                    <section class="action-panel action-panel_purple">
                        <div class="panel-heading"><div><p class="eyebrow">Credential gateway</p><h3>Add Salesforce certification</h3></div><span>Evidence remains unverified until an authorized administrator validates it</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Practitioner" value={credentialDraft.resourceId} options={resourceOptions} data-field="resourceId" onchange={handleCredentialInput} required></lightning-combobox>
                            <lightning-input label="Credential ID" value={credentialDraft.credentialId} data-field="credentialId" onchange={handleCredentialInput} required></lightning-input>
                            <lightning-input label="Credential name" value={credentialDraft.credentialName} data-field="credentialName" onchange={handleCredentialInput} required></lightning-input>
                            <lightning-input label="Issuer" value={credentialDraft.issuer} data-field="issuer" onchange={handleCredentialInput} required></lightning-input>
                            <lightning-input type="date" label="Issue date" value={credentialDraft.issueDate} data-field="issueDate" onchange={handleCredentialInput}></lightning-input>
                            <lightning-input type="date" label="Expiry date" value={credentialDraft.expiryDate} data-field="expiryDate" onchange={handleCredentialInput}></lightning-input>
                            <lightning-input class="form-span" type="url" label="Approved HTTPS evidence URL" value={credentialDraft.evidenceUrl} data-field="evidenceUrl" onchange={handleCredentialInput}></lightning-input>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Submit for verification" onclick={handleAddCredential}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showTimesheetCreate}>
                    <section class="action-panel action-panel_blue">
                        <div class="panel-heading"><div><p class="eyebrow">Weekly actuals</p><h3>Open timesheet week</h3></div><span>Monday week start and employee ownership are server-enforced</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Practitioner" value={timesheetDraft.resourceId} options={resourceOptions} data-field="resourceId" onchange={handleTimesheetInput} required></lightning-combobox>
                            <lightning-input type="date" label="Monday week start" value={timesheetDraft.weekStart} data-field="weekStart" onchange={handleTimesheetInput} required></lightning-input>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Open week" onclick={handleCreateTimesheet}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showTimeEntryForm}>
                    <section class="action-panel action-panel_blue">
                        <div class="panel-heading"><div><p class="eyebrow">Allocation-authorized time</p><h3>Add or update time entry</h3></div><span>Employee, allocation date, daily allocation and aggregate calendar capacity are enforced in Apex</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Timesheet" value={timeDraft.timesheetId} options={timesheetOptions} data-field="timesheetId" onchange={handleTimeInput} required></lightning-combobox>
                            <lightning-combobox label="Accepted allocation" value={timeDraft.allocationId} options={allocationOptions} data-field="allocationId" onchange={handleTimeInput} required></lightning-combobox>
                            <lightning-input type="date" label="Work date" value={timeDraft.workDate} data-field="workDate" onchange={handleTimeInput} required></lightning-input>
                            <lightning-input type="number" label="Hours" value={timeDraft.hours} min="0.25" max="24" step="0.25" data-field="hours" onchange={handleTimeInput} required></lightning-input>
                            <lightning-textarea class="form-span" label="Work comment" value={timeDraft.comment} data-field="comment" onchange={handleTimeInput}></lightning-textarea>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Save time entry" onclick={handleSaveTimeEntry}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showDecisionPanel}>
                    <section class="decision-panel" role="dialog" aria-modal="true" aria-labelledby="decision-title">
                        <div class="panel-heading"><div><p class="eyebrow">Attributable decision</p><h3 id="decision-title">{decisionDraft.title}</h3></div><span>{activeRole}</span></div>
                        <template lwc:if={decisionRequiresLevel}><lightning-combobox label="Approved proficiency" value={decisionDraft.approvedLevel} options={levelOptions} data-field="approvedLevel" onchange={handleDecisionInput}></lightning-combobox></template>
                        <lightning-textarea label="Decision evidence" value={decisionDraft.note} data-field="note" onchange={handleDecisionInput} required={decisionNoteRequired}></lightning-textarea>
                        <div class="panel-footer"><lightning-button label="Cancel" onclick={handleCancelDecision}></lightning-button><lightning-button variant="brand" label="Confirm governed decision" onclick={handleConfirmDecision}></lightning-button></div>
                    </section>
                </template>

                <section class="records-panel">
                    <div class="panel-heading"><div><p class="eyebrow">Live Salesforce data</p><h3>{selectedScreen.title}</h3></div><span>Open a linked record for the standard Salesforce detail page</span></div>
                    <template lwc:if={hasRows}>
                        <lightning-datatable key-field="id" data={tableRows} columns={tableColumns} hide-checkbox-column onrowaction={handleRowAction}></lightning-datatable>
                    </template>
                    <template lwc:else><div class="empty-state"><lightning-icon icon-name="utility:inbox" size="medium"></lightning-icon><h3>No records yet</h3><p>Load the compact sanitized dataset or create a governed record.</p></div></template>
                </section>
                </template>
                <template lwc:else>
                    <section class="unauthorized-panel" role="alert"><lightning-icon icon-name="utility:lock" size="small"></lightning-icon><div><h3>Role or scope does not authorize this screen</h3><p>Choose an assigned active role or request a time-bound Resource 360 role scope. The client cannot elevate access.</p></div></section>
                </template>
            </main>
        </div>
    </article>
</template>
