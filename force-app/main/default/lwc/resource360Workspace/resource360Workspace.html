<template>
    <article class="workspace">
        <header class="hero">
            <div>
                <p class="eyebrow">EXL Salesforce COE</p>
                <h1>Resource 360</h1>
                <p class="subtitle">Native Salesforce staffing, skills, budgeting, allocation and delivery governance</p>
            </div>
            <div class="hero-actions">
                <lightning-combobox label="Active business role" value={activeRole} options={businessRoleOptions} onchange={handleRole}></lightning-combobox>
                <lightning-button label="Refresh" icon-name="utility:refresh" onclick={loadData}></lightning-button>
                <lightning-button variant="brand" label="Load sanitized demo data" icon-name="utility:database" onclick={handleSeed}></lightning-button>
            </div>
        </header>

        <div class="status-strip">
            <span class="status-pill status-pill_good">Salesforce demo system of record</span>
            <span>EXL identities, sources and business volumes are sanitized mock contracts</span>
            <span>{screenCountLabel}</span>
            <span>Last refreshed {generatedLabel}</span>
        </div>

        <template lwc:if={loading}><lightning-spinner alternative-text="Loading Resource 360"></lightning-spinner></template>
        <template lwc:if={errorMessage}><div class="error-panel" role="alert">{errorMessage}</div></template>

        <div class="layout">
            <aside class="module-rail" aria-label="Resource 360 modules">
                <template for:each={modules} for:item="module">
                    <button key={module.id} class={module.buttonClass} data-module={module.id} onclick={handleModule}>
                        <lightning-icon icon-name={module.icon} size="small" alternative-text=""></lightning-icon>
                        <span>{module.label}</span><strong>{module.count}</strong>
                    </button>
                </template>
                <div class="screen-list">
                    <p class="rail-heading">Screens</p>
                    <template for:each={moduleScreens} for:item="screen">
                        <button key={screen.id} class={screen.buttonClass} data-screen={screen.id} onclick={handleScreen}>
                            <span>{screen.id}</span>{screen.title}
                        </button>
                    </template>
                </div>
            </aside>

            <main class="content">
                <section class="metric-grid" aria-label="Resource 360 summary">
                    <template for:each={summaryCards} for:item="card">
                        <article key={card.label} class="metric-card"><p>{card.label}</p><strong>{card.value}</strong><span>{card.note}</span></article>
                    </template>
                </section>

                <section class="screen-heading">
                    <div class="screen-copy">
                        <div class="screen-meta"><span class="screen-id">{selectedScreen.id}</span><span>{selectedScreen.release}</span><span>{selectedScreen.kind}</span></div>
                        <h2>{selectedScreen.title}</h2>
                        <p>{selectedScreen.description}</p>
                    </div>
                    <div class="screen-context"><span class="role-chip">{activeRole}</span><small>Primary PRD action</small><strong>{selectedScreen.primary}</strong></div>
                </section>

                <template lwc:if={isAuthorized}>
                <section class="contract-panel" aria-label="Governed screen contract">
                    <div class="contract-grid">
                        <div><span>Delivery</span><strong>{selectedScreen.delivery}</strong></div>
                        <div><span>Authorized roles</span><strong>{selectedScreen.roleLabel}</strong></div>
                        <div><span>Field and source ownership</span><strong>{selectedScreen.fields}</strong><p>{selectedScreen.source}</p></div>
                        <div><span>Server contract</span><strong>{selectedScreen.api}</strong><p>{selectedScreen.validations}</p></div>
                        <div><span>Traceability</span><strong>{selectedScreen.requirements}</strong><p>{selectedScreen.events}</p></div>
                        <div><span>Acceptance</span><strong>{selectedScreen.acceptance}</strong></div>
                    </div>
                    <div class="state-row" aria-label="Supported screen states">
                        <template for:each={stateVariants} for:item="state"><span key={state.key}>{state.label}</span></template>
                    </div>
                </section>

                <template lwc:if={showStaffingForm}>
                    <section class="action-panel">
                        <div class="panel-heading"><div><p class="eyebrow">Governed command</p><h3>Create staffing request</h3></div><span>Approved-budget and capacity gates run in Apex</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Engagement" value={staffingDraft.engagementId} options={engagementOptions} data-field="engagementId" onchange={handleStaffingInput} required></lightning-combobox>
                            <lightning-combobox label="Candidate" value={staffingDraft.resourceId} options={resourceOptions} data-field="resourceId" onchange={handleStaffingInput} required></lightning-combobox>
                            <lightning-combobox label="Salesforce role" value={staffingDraft.requestedRole} options={deliveryRoleOptions} data-field="requestedRole" onchange={handleStaffingInput} required></lightning-combobox>
                            <lightning-combobox label="Classification" value={staffingDraft.classification} options={classificationOptions} data-field="classification" onchange={handleStaffingInput} required></lightning-combobox>
                            <lightning-input type="date" label="Start date" value={staffingDraft.startDate} data-field="startDate" onchange={handleStaffingInput} required></lightning-input>
                            <lightning-input type="date" label="End date" value={staffingDraft.endDate} data-field="endDate" onchange={handleStaffingInput} required></lightning-input>
                            <lightning-input type="number" label="Daily hours" value={staffingDraft.dailyHours} min="0.25" max="24" step="0.25" data-field="dailyHours" onchange={handleStaffingInput} required></lightning-input>
                            <lightning-combobox label="Unbilled control owner" value={staffingDraft.responsibleOwnerId} options={userOptions} data-field="responsibleOwnerId" onchange={handleStaffingInput}></lightning-combobox>
                            <lightning-input type="date" label="Unbilled review date" value={staffingDraft.reviewDate} data-field="reviewDate" onchange={handleStaffingInput}></lightning-input>
                            <lightning-textarea class="form-span" label="Unbilled control reason" value={staffingDraft.controlReason} data-field="controlReason" onchange={handleStaffingInput}></lightning-textarea>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Submit staffing request" onclick={handleCreateStaffing}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showPlanningPreview}>
                    <section class="action-panel action-panel_blue">
                        <div class="panel-heading"><div><p class="eyebrow">Capacity workbench</p><h3>Preview an effective-dated allocation plan</h3></div><span>Accepted commitments, pending demand and calendar exceptions are shown per day</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Practitioner" value={planningDraft.resourceId} options={resourceOptions} data-field="resourceId" onchange={handlePlanningInput} required></lightning-combobox>
                            <lightning-combobox label="Effort mode" value={planningDraft.mode} options={effortModeOptions} data-field="mode" onchange={handlePlanningInput} required></lightning-combobox>
                            <lightning-input type="date" label="Start date" value={planningDraft.startDate} data-field="startDate" onchange={handlePlanningInput} required></lightning-input>
                            <lightning-input type="date" label="End date" value={planningDraft.endDate} data-field="endDate" onchange={handlePlanningInput} required></lightning-input>
                            <lightning-input type="number" label="Effort" value={planningDraft.effort} min="0.25" step="0.25" data-field="effort" onchange={handlePlanningInput} required></lightning-input>
                            <lightning-input type="checkbox" label="Request controlled past-date override" checked={planningDraft.allowPastOverride} data-field="allowPastOverride" onchange={handlePlanningInput}></lightning-input>
                            <lightning-textarea class="form-span" label="Override evidence" value={planningDraft.overrideReason} data-field="overrideReason" onchange={handlePlanningInput}></lightning-textarea>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Preview capacity" icon-name="utility:preview" onclick={handlePreviewPlan}></lightning-button></div>
                        <template lwc:if={hasPlanningPreview}>
                            <div class="preview-summary" role="status">
                                <div><span>Decision</span><strong>{planningStatus}</strong></div>
                                <div><span>Working days</span><strong>{planningPreview.workingDays}</strong></div>
                                <div><span>Proposed hours</span><strong>{planningPreview.requestedTotalHours}</strong></div>
                                <div><span>Allocation</span><strong>{planningPreview.allocationPercent}%</strong></div>
                                <div><span>Conflicts</span><strong>{planningPreview.conflictDays}</strong></div>
                            </div>
                            <p class="preview-message">{planningPreview.message}</p>
                            <lightning-datatable key-field="id" data={planningDays} columns={planningColumns} hide-checkbox-column></lightning-datatable>
                        </template>
                    </section>
                </template>

                <template lwc:if={showModifyAllocation}>
                    <section class="action-panel">
                        <div class="panel-heading"><div><p class="eyebrow">Effective-dated change</p><h3>Modify accepted allocation</h3></div><span>The prior version is retained and linked to the replacement</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Accepted allocation" value={allocationDraft.allocationId} options={allocationOptions} data-field="allocationId" onchange={handleAllocationInput} required></lightning-combobox>
                            <lightning-combobox label="Salesforce role" value={allocationDraft.roleName} options={deliveryRoleOptions} data-field="roleName" onchange={handleAllocationInput} required></lightning-combobox>
                            <lightning-combobox label="Classification" value={allocationDraft.classification} options={classificationOptions} data-field="classification" onchange={handleAllocationInput} required></lightning-combobox>
                            <lightning-input type="date" label="Start date" value={allocationDraft.startDate} data-field="startDate" onchange={handleAllocationInput} required></lightning-input>
                            <lightning-input type="date" label="End date" value={allocationDraft.endDate} data-field="endDate" onchange={handleAllocationInput} required></lightning-input>
                            <lightning-input type="number" label="Daily hours" value={allocationDraft.dailyHours} min="0.25" max="24" step="0.25" data-field="dailyHours" onchange={handleAllocationInput} required></lightning-input>
                            <lightning-combobox label="Unbilled control owner" value={allocationDraft.responsibleOwnerId} options={userOptions} data-field="responsibleOwnerId" onchange={handleAllocationInput}></lightning-combobox>
                            <lightning-input type="date" label="Unbilled review date" value={allocationDraft.reviewDate} data-field="reviewDate" onchange={handleAllocationInput}></lightning-input>
                            <lightning-textarea class="form-span" label="Change reason" value={allocationDraft.reason} data-field="reason" onchange={handleAllocationInput} required></lightning-textarea>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Create replacement version" onclick={handleModifyAllocation}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showSplitAllocation}>
                    <section class="action-panel">
                        <div class="panel-heading"><div><p class="eyebrow">Allocation lineage</p><h3>Split accepted allocation</h3></div><span>Two non-overlapping current segments replace the selected version</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Accepted allocation" value={allocationDraft.allocationId} options={allocationOptions} data-field="allocationId" onchange={handleAllocationInput} required></lightning-combobox>
                            <lightning-input type="date" label="Second segment starts" value={allocationDraft.splitDate} data-field="splitDate" onchange={handleAllocationInput} required></lightning-input>
                            <lightning-input type="number" label="First segment daily hours" value={allocationDraft.firstDailyHours} min="0.25" max="24" step="0.25" data-field="firstDailyHours" onchange={handleAllocationInput} required></lightning-input>
                            <lightning-input type="number" label="Second segment daily hours" value={allocationDraft.secondDailyHours} min="0.25" max="24" step="0.25" data-field="secondDailyHours" onchange={handleAllocationInput} required></lightning-input>
                            <lightning-textarea class="form-span" label="Split reason" value={allocationDraft.reason} data-field="reason" onchange={handleAllocationInput} required></lightning-textarea>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Split allocation" onclick={handleSplitAllocation}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showDeallocate}>
                    <section class="action-panel">
                        <div class="panel-heading"><div><p class="eyebrow">Controlled release</p><h3>Deallocate practitioner</h3></div><span>The allocation is ended; historical records are never deleted</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Accepted allocation" value={allocationDraft.allocationId} options={allocationOptions} data-field="allocationId" onchange={handleAllocationInput} required></lightning-combobox>
                            <lightning-input type="date" label="Effective end date" value={allocationDraft.effectiveEndDate} data-field="effectiveEndDate" onchange={handleAllocationInput} required></lightning-input>
                            <lightning-textarea class="form-span" label="Deallocation reason" value={allocationDraft.reason} data-field="reason" onchange={handleAllocationInput} required></lightning-textarea>
                        </div>
                        <div class="panel-footer"><lightning-button variant="destructive" label="End allocation" onclick={handleDeallocate}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showBudgetEditor}>
                    <section class="action-panel action-panel_purple">
                        <div class="panel-heading"><div><p class="eyebrow">Commercial assumptions</p><h3>Edit current budget draft</h3></div><span>Approved versions stay immutable; use a successor version for changes</span></div>
                        <div class="form-grid">
                            <lightning-combobox class="form-span" label="Current budget" value={budgetDraft.budgetId} options={budgetOptions} data-field="budgetId" onchange={handleBudgetInput} required></lightning-combobox>
                            <lightning-input type="number" formatter="currency" label="Revenue" value={budgetDraft.revenue} min="0" step="0.01" data-field="revenue" onchange={handleBudgetInput} disabled={budgetFieldsDisabled}></lightning-input>
                            <lightning-input type="number" label="Uplift %" value={budgetDraft.upliftPercent} min="0" max="100" step="0.01" data-field="upliftPercent" onchange={handleBudgetInput} disabled={budgetFieldsDisabled}></lightning-input>
                            <lightning-input type="number" label="Effort contingency %" value={budgetDraft.effortContingencyPercent} min="0" max="100" step="0.01" data-field="effortContingencyPercent" onchange={handleBudgetInput} disabled={budgetFieldsDisabled}></lightning-input>
                            <lightning-input type="number" label="Expense contingency %" value={budgetDraft.expenseContingencyPercent} min="0" max="100" step="0.01" data-field="expenseContingencyPercent" onchange={handleBudgetInput} disabled={budgetFieldsDisabled}></lightning-input>
                            <lightning-input type="number" formatter="currency" label="Travel rate" value={budgetDraft.travelRate} min="0" step="0.01" data-field="travelRate" onchange={handleBudgetInput} disabled={budgetFieldsDisabled}></lightning-input>
                            <lightning-input type="number" label="Onsite months" value={budgetDraft.onsiteMonths} min="0" max="120" step="0.25" data-field="onsiteMonths" onchange={handleBudgetInput} disabled={budgetFieldsDisabled}></lightning-input>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Save assumptions" onclick={handleSaveBudget} disabled={budgetFieldsDisabled}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showBudgetLineEditor}>
                    <section class="action-panel action-panel_purple">
                        <div class="panel-heading"><div><p class="eyebrow">Work breakdown</p><h3>Add budget phase and resource line</h3></div><span>Planned hours and base labour recalculate server-side</span></div>
                        <div class="form-grid">
                            <lightning-combobox class="form-span" label="Current budget" value={budgetDraft.budgetId} options={budgetOptions} data-field="budgetId" onchange={handleBudgetInput} required></lightning-combobox>
                            <lightning-combobox class="form-span" label="Practitioner (optional role placeholder when blank)" value={budgetLineDraft.resourceId} options={resourceOptions} data-field="resourceId" onchange={handleBudgetLineInput} disabled={budgetFieldsDisabled}></lightning-combobox>
                            <lightning-input type="date" label="Period start" value={budgetLineDraft.periodStart} data-field="periodStart" onchange={handleBudgetLineInput} required disabled={budgetFieldsDisabled}></lightning-input>
                            <lightning-input type="date" label="Role start" value={budgetLineDraft.roleStart} data-field="roleStart" onchange={handleBudgetLineInput} disabled={budgetFieldsDisabled}></lightning-input>
                            <lightning-input type="date" label="Role end" value={budgetLineDraft.roleEnd} data-field="roleEnd" onchange={handleBudgetLineInput} disabled={budgetFieldsDisabled}></lightning-input>
                            <lightning-combobox label="Phase" value={budgetLineDraft.phase} options={budgetPhaseOptions} data-field="phase" onchange={handleBudgetLineInput} required disabled={budgetFieldsDisabled}></lightning-combobox>
                            <lightning-combobox label="Work unit" value={budgetLineDraft.workUnit} options={workUnitOptions} data-field="workUnit" onchange={handleBudgetLineInput} required disabled={budgetFieldsDisabled}></lightning-combobox>
                            <lightning-combobox label="Salesforce role" value={budgetLineDraft.roleName} options={deliveryRoleOptions} data-field="roleName" onchange={handleBudgetLineInput} required disabled={budgetFieldsDisabled}></lightning-combobox>
                            <lightning-combobox label="Location" value={budgetLineDraft.location} options={locationOptions} data-field="location" onchange={handleBudgetLineInput} required disabled={budgetFieldsDisabled}></lightning-combobox>
                            <lightning-input type="number" label="Planned hours" value={budgetLineDraft.plannedHours} min="0.25" step="0.25" data-field="plannedHours" onchange={handleBudgetLineInput} required disabled={budgetFieldsDisabled}></lightning-input>
                            <lightning-input type="number" formatter="currency" label="Cost rate" value={budgetLineDraft.costRate} min="0" step="0.01" data-field="costRate" onchange={handleBudgetLineInput} required disabled={budgetFieldsDisabled}></lightning-input>
                            <lightning-input type="number" label="Allocation %" value={budgetLineDraft.allocationPercent} min="0.01" max="100" step="0.01" data-field="allocationPercent" onchange={handleBudgetLineInput} required disabled={budgetFieldsDisabled}></lightning-input>
                            <lightning-input type="checkbox" label="Onsite" checked={budgetLineDraft.onsite} data-field="onsite" onchange={handleBudgetLineInput} disabled={budgetFieldsDisabled}></lightning-input>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Save WBS line" onclick={handleSaveBudgetLine} disabled={budgetFieldsDisabled}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showBudgetLines}>
                    <section class="records-panel records-panel_compact">
                        <div class="panel-heading"><div><p class="eyebrow">Current version detail</p><h3>Budget WBS and resource grid</h3></div><span>Every line is version-bound</span></div>
                        <template lwc:if={hasBudgetLines}><lightning-datatable key-field="Id" data={budgetLineRows} columns={budgetLineColumns} hide-checkbox-column></lightning-datatable></template>
                        <template lwc:else><div class="empty-state"><p>No WBS lines exist for the selected budget version.</p></div></template>
                    </section>
                </template>

                <template lwc:if={showBudgetImport}>
                    <section class="action-panel action-panel_purple">
                        <div class="panel-heading"><div><p class="eyebrow">BUDUI-11 · governed mock operation</p><h3>Atomic monthly resource roster import</h3></div><span>Every row is validated against the current editable budget, engagement dates, active resources and configured Salesforce roles before any row is committed</span></div>
                        <div class="form-grid">
                            <lightning-combobox class="form-span" label="Current budget" value={budgetDraft.budgetId} options={budgetOptions} data-field="budgetId" onchange={handleBudgetInput} required></lightning-combobox>
                            <lightning-input class="form-span" label="Sanitized source file name" value={budgetImportDraft.sourceFileName} data-field="sourceFileName" onchange={handleBudgetImportInput} required></lightning-input>
                            <lightning-textarea class="form-full" label="Controlled monthly roster JSON" value={budgetImportDraft.jsonRows} data-field="jsonRows" onchange={handleBudgetImportInput} required></lightning-textarea>
                        </div>
                        <div class="panel-footer panel-footer_split"><span>Atomic means all rows succeed or none are inserted. Formula-like content, duplicate identities, invalid dates and unknown practitioners are blocked.</span><div><lightning-button label="Pre-validate roster" icon-name="utility:check" onclick={handlePreviewBudgetImport}></lightning-button><lightning-button class="button-gap" variant="brand" label="Commit atomic roster" icon-name="utility:upload" onclick={handleCommitBudgetImport} disabled={budgetFieldsDisabled}></lightning-button><lightning-button class="button-gap" label="Run as-of assurance" icon-name="utility:chart" onclick={handleBudgetAssurance}></lightning-button></div></div>
                        <template lwc:if={hasBudgetImportPreview}>
                            <div class="preview-summary preview-summary_four" role="status"><div><span>Decision</span><strong>{budgetImportPreview.valid}</strong></div><div><span>Total</span><strong>{budgetImportPreview.totalRows}</strong></div><div><span>Valid</span><strong>{budgetImportPreview.validRows}</strong></div><div><span>Invalid</span><strong>{budgetImportPreview.invalidRows}</strong></div></div>
                            <lightning-datatable key-field="rowNumber" data={budgetImportRows} columns={budgetImportColumns} hide-checkbox-column></lightning-datatable>
                            <template lwc:if={hasBudgetImportErrors}><div class="download-row"><a class="slds-button slds-button_neutral" href={budgetImportErrorUrl} download="resource360-budget-roster-errors.csv">Download exact row errors (CSV)</a></div></template>
                        </template>
                    </section>
                    <template lwc:if={hasBudgetAssurance}>
                        <section class="records-panel records-panel_compact">
                            <div class="panel-heading"><div><p class="eyebrow">Version-bound assurance</p><h3>Monthly plan, actual, EAC and 160-hour roster checks</h3></div><span>{budgetAssuranceResult.assumption}</span></div>
                            <div class="preview-summary preview-summary_four"><div><span>As of</span><strong>{budgetAssuranceResult.asOfDate}</strong></div><div><span>Actual hours</span><strong>{budgetAssuranceResult.actualHours}</strong></div><div><span>Estimate at completion</span><strong>{budgetAssuranceResult.estimateAtCompletion}</strong></div><div><span>Forecast margin %</span><strong>{budgetAssuranceResult.forecastMarginPercent}</strong></div></div>
                            <lightning-datatable key-field="id" data={budgetAssuranceMonthlyRows} columns={budgetAssuranceMonthlyColumns} hide-checkbox-column></lightning-datatable>
                            <h4 class="subtable-heading">Resource-month assurance</h4>
                            <lightning-datatable key-field="lineId" data={budgetAssuranceRosterRows} columns={budgetAssuranceRosterColumns} hide-checkbox-column></lightning-datatable>
                        </section>
                    </template>
                </template>

                <template lwc:if={showConfigurationConsole}>
                    <template lwc:if={canManageConfiguration}><section class="action-panel configuration-panel">
                        <div class="panel-heading"><div><p class="eyebrow">Governed runtime control plane</p><h3>Stage and validate configuration</h3></div><span>Every change is effective-dated, independently approved, audited and recoverable as a new version</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Domain" value={configurationDraft.domain} options={configurationDomainOptions} data-field="domain" onchange={handleConfigurationInput} required></lightning-combobox>
                            <lightning-input label="Stable code" value={configurationDraft.code} data-field="code" onchange={handleConfigurationInput} required></lightning-input>
                            <lightning-input label="Display label" value={configurationDraft.displayLabel} data-field="displayLabel" onchange={handleConfigurationInput} required></lightning-input>
                            <lightning-combobox label="Value type" value={configurationDraft.valueType} options={configurationTypeOptions} data-field="valueType" onchange={handleConfigurationInput} required></lightning-combobox>
                            <template lwc:if={configurationIsNumber}><lightning-input type="number" label="Numeric value" value={configurationDraft.numericValue} step="0.01" data-field="numericValue" onchange={handleConfigurationInput} required></lightning-input></template>
                            <template lwc:if={configurationIsText}><lightning-input label="Text value" value={configurationDraft.textValue} data-field="textValue" onchange={handleConfigurationInput} required></lightning-input></template>
                            <template lwc:if={configurationIsBoolean}><lightning-input type="checkbox" label="Enabled" checked={configurationDraft.booleanValue} data-field="booleanValue" onchange={handleConfigurationInput}></lightning-input></template>
                            <lightning-input label="Unit" value={configurationDraft.unit} data-field="unit" onchange={handleConfigurationInput}></lightning-input>
                            <lightning-input type="date" label="Effective from" value={configurationDraft.effectiveFrom} data-field="effectiveFrom" onchange={handleConfigurationInput} required></lightning-input>
                            <lightning-input type="date" label="Effective to" value={configurationDraft.effectiveTo} data-field="effectiveTo" onchange={handleConfigurationInput}></lightning-input>
                            <lightning-textarea class="form-full" label="Attributes JSON" value={configurationDraft.attributesJson} data-field="attributesJson" onchange={handleConfigurationInput} field-level-help="Required for JSON values and enabled delivery roles/classifications. Never place credentials or secrets here."></lightning-textarea>
                            <lightning-textarea class="form-full" label="Change reason and evidence" value={configurationDraft.reason} data-field="reason" onchange={handleConfigurationInput} required></lightning-textarea>
                        </div>
                        <div class="panel-footer panel-footer_split"><span>Secrets, credentials, schema, permissions and platform safety limits remain controlled release assets.</span><div><lightning-button label="Preview impact" icon-name="utility:preview" onclick={handlePreviewConfiguration}></lightning-button><lightning-button class="button-gap" variant="brand" label="Save validated draft" icon-name="utility:save" onclick={handleSaveConfiguration}></lightning-button><template lwc:if={canApproveConfiguration}><lightning-button class="button-gap" label="Apply operations schedule" icon-name="utility:clock" onclick={handleRescheduleOperations}></lightning-button></template></div></div>
                        <template lwc:if={hasConfigurationPreview}>
                            <div class={configurationPreviewClass} role="status">
                                <div><span>Decision</span><strong>{configurationPreviewDecision}</strong></div>
                                <div><span>Key</span><strong>{configurationPreview.key}</strong></div>
                                <div><span>Current</span><strong>{configurationPreview.currentValue}</strong></div>
                                <div><span>Proposed</span><strong>{configurationPreview.normalizedValue}</strong></div>
                            </div>
                            <p class="preview-message"><strong>Impact:</strong> {configurationPreview.impact}</p>
                            <template lwc:if={hasConfigurationErrors}><div class="configuration-messages configuration-messages_error"><strong>Blocking validation</strong><p>{configurationPreviewErrors}</p></div></template>
                            <template lwc:if={hasConfigurationWarnings}><div class="configuration-messages configuration-messages_warning"><strong>Review before submission</strong><p>{configurationPreviewWarnings}</p></div></template>
                        </template>
                    </section></template>
                    <section class="action-panel action-panel_blue">
                        <div class="panel-heading"><div><p class="eyebrow">Atomic change bundle</p><h3>Assign, validate, submit and decide one configuration release</h3></div><span>All settings share one release identity and effective date; activation is all-or-nothing and the submitter cannot approve their own release</span></div>
                        <div class="form-grid">
                            <lightning-input class="form-span" label="Release key" value={configurationReleaseKey} data-field="releaseKey" onchange={handleConfigurationReleaseInput} required></lightning-input>
                            <template lwc:if={hasConfigurationReleaseCandidates}><lightning-combobox class="form-span" label="Draft or rejected setting to assign" value={configurationReleaseSettingId} options={configurationReleaseSettingOptions} data-field="settingId" onchange={handleConfigurationReleaseInput}></lightning-combobox></template>
                        </div>
                        <div class="panel-footer panel-footer_split"><span>The EXL demo permits mock data, but Salesforce still enforces real permission sets, validation, audit and separation of duties.</span><div><template lwc:if={canManageConfiguration}><lightning-button label="Assign setting" onclick={handleAssignConfigurationRelease} disabled={configurationReleaseAssignmentDisabled}></lightning-button><lightning-button class="button-gap" label="Validate release" onclick={handlePreviewConfigurationRelease}></lightning-button><lightning-button class="button-gap" variant="brand" label="Submit release" onclick={handleSubmitConfigurationRelease}></lightning-button></template><template lwc:if={canApproveConfiguration}><lightning-button class="button-gap" label="Approve atomically" onclick={handleApproveConfigurationRelease}></lightning-button><lightning-button class="button-gap" variant="destructive-text" label="Reject atomically" onclick={handleRejectConfigurationRelease}></lightning-button></template></div></div>
                        <template lwc:if={hasConfigurationReleasePreview}>
                            <div class="preview-summary preview-summary_four"><div><span>Release</span><strong>{configurationReleasePreview.releaseKey}</strong></div><div><span>Valid</span><strong>{configurationReleasePreview.valid}</strong></div><div><span>Items</span><strong>{configurationReleasePreview.itemCount}</strong></div><div><span>Effective</span><strong>{configurationReleasePreview.effectiveFrom}</strong></div></div>
                            <template lwc:if={hasConfigurationReleaseErrors}><div class="configuration-messages configuration-messages_error"><strong>Blocking validation</strong><p>{configurationReleaseErrors}</p></div></template>
                            <template lwc:if={hasConfigurationReleaseWarnings}><div class="configuration-messages configuration-messages_warning"><strong>Review before submission</strong><p>{configurationReleaseWarnings}</p></div></template>
                            <lightning-datatable key-field="key" data={configurationReleaseItems} columns={configurationReleaseColumns} hide-checkbox-column></lightning-datatable>
                        </template>
                    </section>
                    <section class="records-panel records-panel_compact">
                        <div class="panel-heading"><div><p class="eyebrow">Version register</p><h3>Defaults, runtime overrides and decision history</h3></div><span>Use row actions to create an override, submit, approve, reject or restore a prior value</span></div>
                        <template lwc:if={hasConfigurationRows}><lightning-datatable key-field="key" data={configurationRows} columns={configurationColumns} onrowaction={handleConfigurationAction} hide-checkbox-column></lightning-datatable></template>
                        <template lwc:else><div class="empty-state empty-state_compact"><p>No configuration records are visible for this permission context.</p></div></template>
                    </section>
                </template>

                <template lwc:if={showBulkOperations}>
                    <section class="action-panel action-panel_blue">
                        <div class="panel-heading"><div><p class="eyebrow">Enhanced-control operation</p><h3>Validate and commit a controlled data batch</h3></div><span>Raw payloads are never retained; file identity, SHA-256 hash, counts and exact row errors are audited</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Entity contract" value={bulkDraft.entityType} options={bulkEntityOptions} data-field="entityType" onchange={handleBulkInput} required></lightning-combobox>
                            <lightning-combobox label="Commit policy" value={bulkDraft.commitMode} options={bulkModeOptions} data-field="commitMode" onchange={handleBulkInput} required></lightning-combobox>
                            <lightning-input class="form-span" label="Source file name" value={bulkDraft.sourceFileName} data-field="sourceFileName" onchange={handleBulkInput} required></lightning-input>
                            <lightning-textarea class="form-full" label="Controlled JSON rows" value={bulkDraft.jsonRows} data-field="jsonRows" onchange={handleBulkInput} required></lightning-textarea>
                        </div>
                        <div class="panel-footer panel-footer_split"><span>Maximum {bulkMaxRows} rows per interactive batch. Replaying identical content returns the same governed run.</span><div><lightning-button label="Pre-validate" icon-name="utility:check" onclick={handlePreviewBulk}></lightning-button><lightning-button class="button-gap" variant="brand" label="Commit batch" icon-name="utility:upload" onclick={handleCommitBulk}></lightning-button></div></div>
                        <template lwc:if={hasBulkPreview}>
                            <div class="preview-summary preview-summary_four" role="status">
                                <div><span>Decision</span><strong>{bulkPreview.message}</strong></div>
                                <div><span>Total rows</span><strong>{bulkPreview.totalRows}</strong></div>
                                <div><span>Valid</span><strong>{bulkPreview.validRows}</strong></div>
                                <div><span>Invalid</span><strong>{bulkPreview.invalidRows}</strong></div>
                            </div>
                            <lightning-datatable key-field="rowNumber" data={bulkPreviewRows} columns={bulkPreviewColumns} hide-checkbox-column></lightning-datatable>
                            <template lwc:if={hasDownloadableBulkErrors}><div class="download-row"><a class="slds-button slds-button_neutral" href={bulkErrorDownloadUrl} download="resource360-row-errors.csv">Download exact row errors (CSV)</a></div></template>
                        </template>
                    </section>
                    <section class="records-panel records-panel_compact">
                        <div class="panel-heading"><div><p class="eyebrow">Batch evidence</p><h3>Integration runs and row outcomes</h3></div><span>Counts reconcile to every accepted/rejected row; sensitive payloads are represented only by hashes</span></div>
                        <template lwc:if={hasBulkRuns}><lightning-datatable key-field="Id" data={bulkRunRows} columns={bulkRunColumns} hide-checkbox-column></lightning-datatable></template>
                        <template lwc:if={hasBulkErrors}><h4 class="subtable-heading">Recent row errors</h4><lightning-datatable key-field="Id" data={bulkErrorRows} columns={bulkErrorColumns} hide-checkbox-column></lightning-datatable></template>
                        <template lwc:if={hasDownloadableBulkErrors}><div class="download-row"><a class="slds-button slds-button_neutral" href={bulkErrorDownloadUrl} download="resource360-row-errors.csv">Download exact row errors (CSV)</a></div></template>
                    </section>
                </template>

                <template lwc:if={showPersonaAssurance}>
                    <section class="records-panel records-panel_compact">
                        <div class="panel-heading"><div><p class="eyebrow">R360-MOCK-ACTIVATION-2026-08-24</p><h3>Persona, scope, Entra and decision-authority matrix</h3></div><span>Every active business role resolves to an approved mock Salesforce assignment and segregation class</span></div>
                        <template lwc:if={hasPersonas}><lightning-datatable key-field="id" data={personaRows} columns={personaColumns} hide-checkbox-column></lightning-datatable></template>
                        <template lwc:else><div class="empty-state empty-state_compact"><p>No active governed persona mapping is available.</p></div></template>
                        <div class="panel-footer"><span>Delegation is effective-dated, attributable and validated against the persona contract. Production Entra group IDs and named EXL assignees remain environment-owned activation data.</span></div>
                    </section>
                </template>

                <template lwc:if={showSourceAssurance}>
                    <section class="records-panel records-panel_compact">
                        <div class="panel-heading"><div><p class="eyebrow">R360-MOCK-1.2</p><h3>Explicit EXL source contracts and reconciliation evidence</h3></div><span>{data.assurance.notice}</span></div>
                        <template lwc:if={hasSourceContracts}><lightning-datatable key-field="id" data={sourceContractRows} columns={sourceContractColumns} hide-checkbox-column></lightning-datatable></template>
                        <div class="panel-footer panel-footer_split"><span>These are deterministic sanitized source assumptions—not connected EXL production integrations. Production endpoints and credentials remain activation dependencies.</span><lightning-button label="Run non-destructive retention dry run" icon-name="utility:shield" onclick={handleRunRetention}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showRetentionAssurance}>
                    <section class="records-panel records-panel_compact">
                        <div class="panel-heading"><div><p class="eyebrow">ADM-003 · approved mock schedule</p><h3>Retention, recovery and legal-hold contract</h3></div><span>{data.assurance.retention.notice}</span></div>
                        <template lwc:if={hasRetentionRules}><lightning-datatable key-field="id" data={retentionRows} columns={retentionColumns} hide-checkbox-column></lightning-datatable></template>
                        <template lwc:else><div class="empty-state empty-state_compact"><p>No approved mock retention rule is available.</p></div></template>
                        <div class="preview-summary preview-summary_four" role="status">
                            <div><span>Execution mode</span><strong>{data.assurance.retention.executionMode}</strong></div>
                            <div><span>Legal hold active</span><strong>{data.assurance.retention.legalHold}</strong></div>
                            <div><span>Audit candidates</span><strong>{data.assurance.retention.auditCandidateCount}</strong></div>
                            <div><span>Run candidates</span><strong>{data.assurance.retention.integrationRunCandidateCount}</strong></div>
                        </div>
                        <div class="panel-footer"><span>Deletion remains disabled. A production EXL release must supply approved legal-hold, backup, recovery and disposition evidence before destructive execution can be enabled.</span></div>
                    </section>
                </template>

                <template lwc:if={showTimeExceptions}>
                    <section class="records-panel records-panel_compact">
                        <div class="panel-heading"><div><p class="eyebrow">TIMEUI-08</p><h3>Timesheet compliance exceptions</h3></div><span>Late submission, late decision, correction and dual-control routes are computed from Salesforce records and governed policy</span></div>
                        <template lwc:if={hasTimeExceptions}><lightning-datatable key-field="timesheetId" data={timeExceptionRows} columns={timeExceptionColumns} hide-checkbox-column></lightning-datatable></template>
                        <template lwc:else><div class="empty-state empty-state_compact"><p>No current timesheet exception meets a governed rule.</p></div></template>
                    </section>
                </template>

                <template lwc:if={showKpiHierarchy}>
                    <section class="records-panel records-panel_compact">
                        <div class="panel-heading"><div><p class="eyebrow">Versioned KPI hierarchy</p><h3>Portfolio to Salesforce tower allocation facts</h3></div><span>Daily capacity, billed mix and WAR use current accepted allocation snapshots; demo thresholds are configurable policy metadata</span></div>
                        <template lwc:if={hasHierarchyRows}><lightning-datatable key-field="id" data={hierarchyRows} columns={hierarchyColumns} hide-checkbox-column></lightning-datatable></template>
                        <template lwc:else><div class="empty-state empty-state_compact"><p>No active accepted allocation falls in today’s effective window.</p></div></template>
                    </section>
                </template>

                <template lwc:if={showTalentSearch}>
                    <section class="action-panel action-panel_blue">
                        <div class="panel-heading"><div><p class="eyebrow">Explainable matching</p><h3>Search Salesforce talent</h3></div><span>Capability is a hard gate; every weighted score is explained</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Capability" value={talentDraft.capabilityId} options={capabilityOptions} data-field="capabilityId" onchange={handleTalentInput}></lightning-combobox>
                            <lightning-combobox label="Minimum proficiency" value={talentDraft.minimumLevel} options={levelOptions} data-field="minimumLevel" onchange={handleTalentInput}></lightning-combobox>
                            <lightning-combobox label="Requested role" value={talentDraft.requestedRole} options={deliveryRoleOptions} data-field="requestedRole" onchange={handleTalentInput}></lightning-combobox>
                            <lightning-input label="Tower" value={talentDraft.tower} data-field="tower" onchange={handleTalentInput}></lightning-input>
                            <lightning-input label="Location" value={talentDraft.location} data-field="location" onchange={handleTalentInput}></lightning-input>
                            <lightning-input type="date" label="Start date" value={talentDraft.startDate} data-field="startDate" onchange={handleTalentInput} required></lightning-input>
                            <lightning-input type="date" label="End date" value={talentDraft.endDate} data-field="endDate" onchange={handleTalentInput} required></lightning-input>
                            <lightning-input type="number" label="Daily hours" value={talentDraft.dailyHours} min="0.25" max="24" step="0.25" data-field="dailyHours" onchange={handleTalentInput}></lightning-input>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Rank eligible talent" onclick={handleTalentSearch}></lightning-button></div>
                        <template lwc:if={hasTalentResults}><lightning-datatable key-field="resourceId" data={talentResults} columns={talentColumns} hide-checkbox-column></lightning-datatable></template>
                    </section>
                </template>

                <template lwc:if={showPractitionerProfile}>
                    <section class="action-panel action-panel_purple">
                        <div class="panel-heading"><div><p class="eyebrow">Salesforce practitioner 360</p><h3>Source-attributed capability profile</h3></div><span>Claimed proficiency, approved proficiency, credentials, learning and verified delivery evidence remain distinct</span></div>
                        <lightning-combobox label="Practitioner" value={profileResourceId} options={resourceOptions} onchange={handleProfileInput} required></lightning-combobox>
                        <div class="profile-facts">
                            <template for:each={profileFacts} for:item="fact"><div key={fact.label}><span>{fact.label}</span><strong>{fact.value}</strong></div></template>
                        </div>
                    </section>
                    <section class="records-panel profile-section">
                        <div class="panel-heading"><div><p class="eyebrow">Manager-reviewed</p><h3>Salesforce and industry capability claims</h3></div><span>Requested and approved levels are shown separately</span></div>
                        <template lwc:if={hasProfileClaims}><lightning-datatable key-field="Id" data={profileClaimRows} columns={profileClaimColumns} hide-checkbox-column></lightning-datatable></template>
                        <template lwc:else><div class="empty-state empty-state_compact"><p>No governed capability claims are available.</p></div></template>
                    </section>
                    <section class="records-panel profile-section">
                        <div class="panel-heading"><div><p class="eyebrow">Externally verified</p><h3>Salesforce certifications</h3></div><span>Only active verified credentials satisfy mandatory certification gates</span></div>
                        <template lwc:if={hasProfileCredentials}><lightning-datatable key-field="Id" data={profileCredentialRows} columns={profileCredentialColumns} hide-checkbox-column></lightning-datatable></template>
                        <template lwc:else><div class="empty-state empty-state_compact"><p>No credential records are available.</p></div></template>
                    </section>
                    <section class="records-panel profile-section">
                        <div class="panel-heading"><div><p class="eyebrow">Read-only source</p><h3>EXL and Salesforce learning</h3></div><span>Learning completion does not become a proficiency claim</span></div>
                        <template lwc:if={hasProfileLearning}><lightning-datatable key-field="Id" data={profileLearningRows} columns={profileLearningColumns} hide-checkbox-column></lightning-datatable></template>
                        <template lwc:else><div class="empty-state empty-state_compact"><p>No externally sourced learning records are available.</p></div></template>
                    </section>
                    <section class="records-panel profile-section">
                        <div class="panel-heading"><div><p class="eyebrow">Delivery evidence</p><h3>Verified project experience</h3></div><span>Authorized engagement context supports recency and duration scoring</span></div>
                        <template lwc:if={hasProfileEvidence}><lightning-datatable key-field="Id" data={profileEvidenceRows} columns={profileEvidenceColumns} hide-checkbox-column></lightning-datatable></template>
                        <template lwc:else><div class="empty-state empty-state_compact"><p>No verified project evidence is available.</p></div></template>
                    </section>
                </template>

                <template lwc:if={showSkillsForm}>
                    <section class="action-panel action-panel_purple">
                        <div class="panel-heading"><div><p class="eyebrow">Manager-reviewed evidence</p><h3>Submit capability claim</h3></div><span>Only approved levels enter talent search</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Practitioner" value={skillDraft.resourceId} options={resourceOptions} data-field="resourceId" onchange={handleSkillInput} required></lightning-combobox>
                            <lightning-combobox label="Capability" value={skillDraft.capabilityId} options={capabilityOptions} data-field="capabilityId" onchange={handleSkillInput} required></lightning-combobox>
                            <lightning-combobox label="Requested proficiency" value={skillDraft.requestedLevel} options={levelOptions} data-field="requestedLevel" onchange={handleSkillInput} required></lightning-combobox>
                            <lightning-input type="number" label="Years of experience" value={skillDraft.yearsExperience} min="0" max="50" step="0.25" data-field="yearsExperience" onchange={handleSkillInput}></lightning-input>
                            <lightning-textarea class="form-span" label="Evidence" value={skillDraft.evidence} data-field="evidence" onchange={handleSkillInput}></lightning-textarea>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Submit capability claim" onclick={handleSubmitClaim}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showCredentialForm}>
                    <section class="action-panel action-panel_purple">
                        <div class="panel-heading"><div><p class="eyebrow">Credential gateway</p><h3>Add Salesforce certification</h3></div><span>Evidence remains unverified until an authorized administrator validates it</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Practitioner" value={credentialDraft.resourceId} options={resourceOptions} data-field="resourceId" onchange={handleCredentialInput} required></lightning-combobox>
                            <lightning-input label="Credential ID" value={credentialDraft.credentialId} data-field="credentialId" onchange={handleCredentialInput} required></lightning-input>
                            <lightning-input label="Credential name" value={credentialDraft.credentialName} data-field="credentialName" onchange={handleCredentialInput} required></lightning-input>
                            <lightning-input label="Issuer" value={credentialDraft.issuer} data-field="issuer" onchange={handleCredentialInput} required></lightning-input>
                            <lightning-input type="date" label="Issue date" value={credentialDraft.issueDate} data-field="issueDate" onchange={handleCredentialInput}></lightning-input>
                            <lightning-input type="date" label="Expiry date" value={credentialDraft.expiryDate} data-field="expiryDate" onchange={handleCredentialInput}></lightning-input>
                            <lightning-input class="form-span" type="url" label="Approved HTTPS evidence URL" value={credentialDraft.evidenceUrl} data-field="evidenceUrl" onchange={handleCredentialInput}></lightning-input>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Submit for verification" onclick={handleAddCredential}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showTimesheetCreate}>
                    <section class="action-panel action-panel_blue">
                        <div class="panel-heading"><div><p class="eyebrow">Weekly actuals</p><h3>Open timesheet week</h3></div><span>Monday week start and employee ownership are server-enforced</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Practitioner" value={timesheetDraft.resourceId} options={resourceOptions} data-field="resourceId" onchange={handleTimesheetInput} required></lightning-combobox>
                            <lightning-input type="date" label="Monday week start" value={timesheetDraft.weekStart} data-field="weekStart" onchange={handleTimesheetInput} required></lightning-input>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Open week" onclick={handleCreateTimesheet}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showTimeEntryForm}>
                    <section class="action-panel action-panel_blue">
                        <div class="panel-heading"><div><p class="eyebrow">Allocation-authorized time</p><h3>Add or update time entry</h3></div><span>Employee, allocation date, daily allocation and aggregate calendar capacity are enforced in Apex</span></div>
                        <div class="form-grid">
                            <lightning-combobox label="Timesheet" value={timeDraft.timesheetId} options={timesheetOptions} data-field="timesheetId" onchange={handleTimeInput} required></lightning-combobox>
                            <lightning-combobox label="Accepted allocation" value={timeDraft.allocationId} options={allocationOptions} data-field="allocationId" onchange={handleTimeInput} required></lightning-combobox>
                            <lightning-input type="date" label="Work date" value={timeDraft.workDate} data-field="workDate" onchange={handleTimeInput} required></lightning-input>
                            <lightning-input type="number" label="Hours" value={timeDraft.hours} min="0.25" max="24" step="0.25" data-field="hours" onchange={handleTimeInput} required></lightning-input>
                            <lightning-textarea class="form-span" label="Work comment" value={timeDraft.comment} data-field="comment" onchange={handleTimeInput}></lightning-textarea>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Save time entry" onclick={handleSaveTimeEntry}></lightning-button></div>
                    </section>
                </template>

                <template lwc:if={showScenarioPlanner}>
                    <section class="action-panel action-panel_blue">
                        <div class="panel-heading"><div><p class="eyebrow">AIUI-03 · deterministic planning mock</p><h3>Isolated Salesforce COE what-if scenario</h3></div><span>The calculation is non-persistent and never changes staffing, budgets or allocations</span></div>
                        <div class="form-grid">
                            <lightning-input class="form-span" label="Scenario name" value={scenarioDraft.name} data-field="name" onchange={handleScenarioInput} required></lightning-input>
                            <lightning-input type="date" label="Start date" value={scenarioDraft.startDate} data-field="startDate" onchange={handleScenarioInput} required></lightning-input>
                            <lightning-input type="date" label="End date" value={scenarioDraft.endDate} data-field="endDate" onchange={handleScenarioInput} required></lightning-input>
                            <lightning-input type="number" label="Headcount delta" value={scenarioDraft.headcountDelta} step="1" data-field="headcountDelta" onchange={handleScenarioInput}></lightning-input>
                            <lightning-input type="number" label="Billable allocation %" value={scenarioDraft.billableAllocationPercent} min="0" max="100" step="1" data-field="billableAllocationPercent" onchange={handleScenarioInput}></lightning-input>
                        </div>
                        <div class="panel-footer"><lightning-button variant="brand" label="Run isolated scenario" icon-name="utility:flow" onclick={handleRunScenario}></lightning-button></div>
                        <template lwc:if={hasScenarioResult}><div class="preview-summary preview-summary_four"><div><span>Business days</span><strong>{scenarioResult.businessDays}</strong></div><div><span>Incremental capacity</span><strong>{scenarioResult.incrementalCapacityHours}</strong></div><div><span>Incremental billable</span><strong>{scenarioResult.incrementalBillableHours}</strong></div><div><span>Billable allocation %</span><strong>{scenarioResult.billableAllocationPercent}</strong></div></div><p class="preview-message">{scenarioResult.notice}</p></template>
                    </section>
                </template>

                <template lwc:if={showAlertLifecycle}>
                    <section class="records-panel records-panel_compact">
                        <div class="panel-heading"><div><p class="eyebrow">Accountable lifecycle</p><h3>Preserve trigger, owner, first seen and closure evidence</h3></div><span>Closing an alert never deletes or rewrites the original trigger</span></div>
                        <lightning-textarea label="Closure evidence applied to the selected open alert" value={alertClosureNote} onchange={handleAlertClosureNote} required></lightning-textarea>
                        <template lwc:if={hasNotificationLifecycleRows}><lightning-datatable key-field="Id" data={notificationLifecycleRows} columns={notificationLifecycleColumns} onrowaction={handleNotificationLifecycleAction} hide-checkbox-column></lightning-datatable></template>
                    </section>
                </template>

                <template lwc:if={showDecisionPanel}>
                    <section class="decision-panel" role="dialog" aria-modal="true" aria-labelledby="decision-title">
                        <div class="panel-heading"><div><p class="eyebrow">Attributable decision</p><h3 id="decision-title">{decisionDraft.title}</h3></div><span>{activeRole}</span></div>
                        <template lwc:if={decisionRequiresLevel}><lightning-combobox label="Approved proficiency" value={decisionDraft.approvedLevel} options={levelOptions} data-field="approvedLevel" onchange={handleDecisionInput}></lightning-combobox></template>
                        <lightning-textarea label="Decision evidence" value={decisionDraft.note} data-field="note" onchange={handleDecisionInput} required={decisionNoteRequired}></lightning-textarea>
                        <div class="panel-footer"><lightning-button label="Cancel" onclick={handleCancelDecision}></lightning-button><lightning-button variant="brand" label="Confirm governed decision" onclick={handleConfirmDecision}></lightning-button></div>
                    </section>
                </template>

                <section class="records-panel">
                    <div class="panel-heading"><div><p class="eyebrow">Live Salesforce data</p><h3>{selectedScreen.title}</h3></div><span>Open a linked record for the standard Salesforce detail page</span></div>
                    <template lwc:if={hasRows}>
                        <lightning-datatable key-field="id" data={tableRows} columns={tableColumns} hide-checkbox-column onrowaction={handleRowAction}></lightning-datatable>
                    </template>
                    <template lwc:else><div class="empty-state"><lightning-icon icon-name="utility:inbox" size="medium"></lightning-icon><h3>No records yet</h3><p>Load the compact sanitized dataset or create a governed record.</p></div></template>
                </section>
                </template>
                <template lwc:else>
                    <section class="unauthorized-panel" role="alert"><lightning-icon icon-name="utility:lock" size="small"></lightning-icon><div><h3>Role or scope does not authorize this screen</h3><p>Choose an assigned active role or request a time-bound Resource 360 role scope. The client cannot elevate access.</p></div></section>
                </template>
            </main>
        </div>
    </article>
</template>
