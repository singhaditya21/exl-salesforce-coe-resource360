<template>
    <lightning-card>
        <div class="shell">
            <header class="hero">
                <div><p class="eyebrow">EXL Salesforce COE · Resource 360</p><h1>Project delivery workbench</h1><p>Contract-backed planning, skills-aware staffing, dynamic allocation, delivery evidence and closeout gates.</p></div>
                <div class="hero-actions"><lightning-combobox variant="label-hidden" label="Project" value={projectId} options={projectOptions} onchange={handleProject}></lightning-combobox><lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh plan" onclick={handleRefresh}></lightning-button-icon></div>
            </header>
            <template lwc:if={busy}><lightning-spinner alternative-text="Loading governed project plan" size="small"></lightning-spinner></template>
            <template lwc:if={error}><div class="error" role="alert">{error}</div></template>
            <template lwc:if={plan}>
                <template lwc:if={canManageProjects}>
                    <lightning-accordion class="intake" allow-multiple-sections-open>
                        <lightning-accordion-section name="project-intake" label="Governed project intake · create project and initial SOW">
                            <div class="form-grid"><lightning-input label="Project code" value={intakeDraft.code} data-field="code" onchange={handleIntakeDraft} required></lightning-input><lightning-input label="Project name" value={intakeDraft.name} data-field="name" onchange={handleIntakeDraft} required></lightning-input><lightning-combobox label="Authorized portfolio" value={intakeDraft.portfolioId} options={portfolioOptions} data-field="portfolioId" onchange={handleIntakeDraft} required></lightning-combobox><lightning-input label="Industry" value={intakeDraft.industry} data-field="industry" onchange={handleIntakeDraft}></lightning-input><lightning-input label="Salesforce tower" value={intakeDraft.tower} data-field="tower" onchange={handleIntakeDraft}></lightning-input><lightning-combobox label="Revenue type" value={intakeDraft.revenueType} options={revenueTypeOptions} data-field="revenueType" onchange={handleIntakeDraft}></lightning-combobox><lightning-input type="date" label="Project start" value={intakeDraft.startDate} data-field="startDate" onchange={handleIntakeDraft} required></lightning-input><lightning-input type="date" label="Project end" value={intakeDraft.endDate} data-field="endDate" onchange={handleIntakeDraft} required></lightning-input><lightning-input label="Currency" value={intakeDraft.currencyCode} data-field="currencyCode" onchange={handleIntakeDraft}></lightning-input><lightning-input label="Initial SOW ID" value={intakeDraft.contractExternalId} data-field="contractExternalId" onchange={handleIntakeDraft} required></lightning-input><lightning-input type="number" label="Initial SOW value" value={intakeDraft.contractValue} data-field="contractValue" onchange={handleIntakeDraft} required></lightning-input><lightning-input label="Intake correlation ID" value={intakeDraft.correlationId} data-field="correlationId" onchange={handleIntakeDraft}></lightning-input></div>
                            <div class="button-row"><lightning-button variant="brand" label="Create project and SOW" onclick={handleCreateProject}></lightning-button></div>
                        </lightning-accordion-section>
                    </lightning-accordion>
                </template>
                <section class="project-context" aria-label="Project hierarchy">
                    <article><span>Account</span><strong>{accountName}</strong><small>{plan.engagement.Industry__c}</small></article>
                    <article><span>Portfolio</span><strong>{portfolioName}</strong><small>{plan.engagement.Portfolio_ID__c}</small></article>
                    <article><span>Sub-portfolio</span><strong>{subPortfolioName}</strong><small>{plan.engagement.Salesforce_Tower__c}</small></article>
                    <article><span>Delivery owner</span><strong>{projectManagerName}</strong><small>{plan.engagement.Revenue_Type__c}</small></article>
                </section>
                <section class="kpis" aria-label="Project health">
                    <article><span>Lifecycle</span><strong>{plan.engagement.Lifecycle_Stage__c}</strong><small>{plan.engagement.Engagement_ID__c}</small></article>
                    <article><span>Earned completion</span><strong>{plan.engagement.Completion_Percent__c}%</strong><lightning-progress-bar value={plan.engagement.Completion_Percent__c}></lightning-progress-bar></article>
                    <article><span>Approved contract</span><strong><lightning-formatted-number value={contractValue} format-style="currency" currency-code="INR" maximum-fraction-digits="0"></lightning-formatted-number></strong><small>{plan.commercialReferences.length} governed version(s)</small></article>
                    <article><span>Current budget</span><strong>{budgetState}</strong><small>{budgetHours} planned hours · v{budgetVersion}</small></article>
                    <article><span>Delivery capacity</span><strong>{activeAllocationCount}</strong><small>current accepted allocation(s)</small></article>
                    <article><span>Open delivery risks</span><strong>{openRiskCount}</strong><small>closeout: {closeoutStatus}</small></article>
                </section>

                <lightning-tabset>
                    <lightning-tab label="Dynamic Gantt" value="gantt">
                        <section class="panel">
                            <div class="panel-heading"><div><p class="eyebrow">PM-controlled baseline and forecast</p><h2>Delivery plan</h2></div><lightning-radio-group name="zoom" label="Timeline zoom" variant="label-hidden" type="button" value={zoom} options={zoomOptions} onchange={handleZoom}></lightning-radio-group></div>
                            <p class="hint">Drag a work package to reschedule it and cascade successors. Critical-path tasks have a red edge; the darker fill shows earned completion.</p>
                            <template lwc:if={hasTasks}>
                                <div class="gantt-scroll">
                                    <div class="gantt" style={ganttStyle}>
                                        <div class="gantt-head"><div class="task-label task-label_head">Work package</div><div class="axis"><template for:each={axisLabels} for:item="label"><span key={label.key} style={label.style}>{label.label}</span></template></div></div>
                                        <template for:each={taskRows} for:item="task">
                                            <div class={task.rowClass} key={task.Id}>
                                                <button class="task-label" data-id={task.Id} onclick={handleTaskSelect} title={task.dependencyText}><strong>{task.Work_Unit_Code__c}</strong><span>{task.Name}</span><small>{task.resourceName} · {task.Percent_Complete__c}% · {task.actualHours}h actual</small></button>
                                                <div class="track" ondragover={allowDrop} ondrop={handleDrop}>
                                                    <span class="baseline" style={task.barStyle}></span>
                                                    <button class={task.barClass} style={task.barStyle} data-id={task.Id} draggable="true" ondragstart={handleDragStart} onclick={handleTaskSelect} title={task.dependencyText}><span class="task-progress" style={task.progressStyle}></span><em>{task.Phase__c}</em><span class="resize-handle" data-id={task.Id} draggable="true" ondragstart={handleResizeStart} title="Drag to resize duration" aria-label="Drag to resize duration"></span></button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <template lwc:else><div class="empty">No work packages have been planned for this project.</div></template>
                        </section>

                        <template lwc:if={selectedTask}>
                            <section class="panel detail-panel"><div class="panel-heading"><div><p class="eyebrow">Selected work package</p><h2>{selectedTask.Work_Unit_Code__c} · {selectedTask.Name}</h2></div><span class="status">{selectedTask.Acceptance_Status__c}</span></div>
                                <div class="form-grid"><lightning-input type="date" label="Forecast start" value={edit.startDate} data-field="startDate" onchange={handleEdit}></lightning-input><lightning-input type="date" label="Forecast end" value={edit.endDate} data-field="endDate" onchange={handleEdit}></lightning-input><lightning-input type="checkbox" label="Cascade successors" checked={edit.cascade} data-field="cascade" onchange={handleEdit}></lightning-input><lightning-textarea class="span-3" label="Change / progress evidence" value={edit.note} data-field="note" onchange={handleEdit}></lightning-textarea></div>
                                <div class="button-row"><lightning-button variant="brand" label="Save forecast dates" onclick={handleReschedule}></lightning-button></div>
                                <div class="form-grid section-rule"><lightning-input type="number" min="0" max="100" label="Completion %" value={edit.percentComplete} data-field="percentComplete" onchange={handleEdit}></lightning-input><lightning-combobox label="Delivery status" value={edit.status} options={statusOptions} data-field="status" onchange={handleEdit}></lightning-combobox><lightning-textarea label="Acceptance evidence" value={edit.acceptanceNote} data-field="acceptanceNote" onchange={handleEdit}></lightning-textarea></div>
                                <div class="button-row"><lightning-button label="Update progress" onclick={handleProgress}></lightning-button><template lwc:if={selectedTask.Acceptance_Required__c}><lightning-button variant="brand-outline" label="Record acceptance" onclick={handleAcceptance}></lightning-button></template></div>
                            </section>
                        </template>

                        <div class="two-column">
                            <section class="panel"><div class="panel-heading"><div><p class="eyebrow">Plan work</p><h2>Add work package</h2></div></div><div class="form-grid"><lightning-input label="WBS code" value={taskDraft.code} data-field="code" onchange={handleTaskDraft} required></lightning-input><lightning-input label="Name" value={taskDraft.name} data-field="name" onchange={handleTaskDraft} required></lightning-input><lightning-input label="Phase" value={taskDraft.phase} data-field="phase" onchange={handleTaskDraft} required></lightning-input><lightning-input type="number" label="Sequence" value={taskDraft.sequence} data-field="sequence" onchange={handleTaskDraft}></lightning-input><lightning-input type="date" label="Start" value={taskDraft.startDate} data-field="startDate" onchange={handleTaskDraft} required></lightning-input><lightning-input type="date" label="End" value={taskDraft.endDate} data-field="endDate" onchange={handleTaskDraft} required></lightning-input><lightning-input type="number" label="Planned hours" value={taskDraft.plannedHours} data-field="plannedHours" onchange={handleTaskDraft}></lightning-input><lightning-input type="number" label="Daily hours" value={taskDraft.dailyHours} data-field="dailyHours" onchange={handleTaskDraft}></lightning-input><lightning-combobox label="Allocated resource" value={taskDraft.assignedResourceId} options={resourceOptions} data-field="assignedResourceId" onchange={handleTaskDraft}></lightning-combobox><lightning-input type="checkbox" label="Milestone" checked={taskDraft.milestone} data-field="milestone" onchange={handleTaskDraft}></lightning-input><lightning-input type="checkbox" label="Deliverable" checked={taskDraft.deliverable} data-field="deliverable" onchange={handleTaskDraft}></lightning-input><lightning-input type="checkbox" label="Acceptance required" checked={taskDraft.acceptanceRequired} data-field="acceptanceRequired" onchange={handleTaskDraft}></lightning-input></div><div class="button-row"><lightning-button variant="brand" label="Add to Gantt" onclick={handleCreateTask}></lightning-button></div></section>
                            <section class="panel"><div class="panel-heading"><div><p class="eyebrow">Plan sequence</p><h2>Add dependency</h2></div></div><div class="form-stack"><lightning-combobox label="Predecessor" value={dependencyDraft.predecessorId} options={taskOptions} data-field="predecessorId" onchange={handleDependencyDraft}></lightning-combobox><lightning-combobox label="Successor" value={dependencyDraft.successorId} options={taskOptions} data-field="successorId" onchange={handleDependencyDraft}></lightning-combobox><lightning-combobox label="Relationship" value={dependencyDraft.dependencyType} options={dependencyTypeOptions} data-field="dependencyType" onchange={handleDependencyDraft}></lightning-combobox><lightning-input type="number" label="Lag days" value={dependencyDraft.lagDays} data-field="lagDays" onchange={handleDependencyDraft}></lightning-input></div><div class="button-row"><lightning-button variant="brand" label="Save dependency" onclick={handleCreateDependency}></lightning-button></div></section>
                        </div>
                    </lightning-tab>

                    <lightning-tab label="Modules, skills & resources" value="delivery360">
                        <section class="panel"><div class="panel-heading"><div><p class="eyebrow">Project decomposition</p><h2>{moduleCount} governed project modules</h2></div><span class="status">{plan.engagement.Salesforce_Tower__c}</span></div>
                            <template lwc:if={hasModules}><div class="card-grid"><template for:each={plan.modules} for:item="item"><article class="metric-card" key={item.Id}><div class="metric-card__head"><div><strong>{item.Module_ID__c} · {item.Name}</strong><span>{item.Module_Type__c}</span></div><span class="status">{item.Health__c}</span></div><div class="metric-card__facts"><span>{item.Status__c}</span><span>{item.Completion_Percent__c}% complete</span><span>{item.Owner_Resource__r.Preferred_Name__c}</span></div><lightning-progress-bar value={item.Completion_Percent__c}></lightning-progress-bar></article></template></div></template><template lwc:else><div class="empty">No governed modules are linked to this project.</div></template>
                        </section>
                        <div class="two-column">
                            <section class="panel"><div class="panel-heading"><div><p class="eyebrow">Three-dimensional matching</p><h2>{skillRequirementCount} skill requirements</h2></div></div><template lwc:if={hasSkillRequirements}><template for:each={plan.skillRequirements} for:item="item"><article class="list-card" key={item.Id}><div><strong>{item.Capability__r.Name}</strong><span>{item.Dimension__c} · {item.Requested_Role__c}</span></div><div><span>Level {item.Required_Level__c}</span><small>{item.Required_Count__c} required</small></div></article></template></template><template lwc:else><div class="empty">No industry, functional or technical requirements have been recorded.</div></template></section>
                            <section class="panel"><div class="panel-heading"><div><p class="eyebrow">Demand-to-allocation trace</p><h2>{staffingRequestCount} governed staffing requests</h2></div></div><template lwc:if={hasStaffingRequests}><template for:each={plan.staffingRequests} for:item="item"><article class="list-card" key={item.Id}><div><strong>{item.Requested_Role__c}</strong><span>{item.Resource__r.Preferred_Name__c} · {item.Classification__c}</span></div><div><span>{item.State__c}</span><small>{item.Fit_Score__c}% fit</small></div></article></template></template><template lwc:else><div class="empty">No staffing demand has been recorded.</div></template></section>
                        </div>
                        <section class="panel"><div class="panel-heading"><div><p class="eyebrow">Portfolio-aligned delivery team</p><h2>{activeAllocationCount} current allocations</h2></div></div><div class="card-grid"><template for:each={plan.allocations} for:item="item"><article class="metric-card" key={item.Id}><div class="metric-card__head"><div><strong>{item.Resource__r.Preferred_Name__c}</strong><span>{item.Role__c}</span></div><span class="status">{item.State__c}</span></div><div class="metric-card__facts"><span>{item.Resource__r.Tower__c}</span><span>{item.Daily_Hours__c}h/day</span><span>{item.Allocation_Percent__c}%</span></div></article></template></div></section>
                    </lightning-tab>

                    <lightning-tab label="Contract & budget" value="commercial">
                        <div class="two-column"><section class="panel"><div class="panel-heading"><div><p class="eyebrow">Commercial lineage</p><h2>Contract versions</h2></div></div><template for:each={plan.commercialReferences} for:item="item"><article class="list-card" key={item.Id}><div><strong>{item.External_ID__c}</strong><span>{item.Reference_Type__c} · v{item.Version__c}</span></div><div><lightning-formatted-number value={item.Value__c} format-style="currency" currency-code="INR" maximum-fraction-digits="0"></lightning-formatted-number><small>{item.Approval_Status__c}</small></div></article></template></section><section class="panel"><div class="panel-heading"><div><p class="eyebrow">Contract-to-delivery trace</p><h2>Lines and acceptance</h2></div></div><template for:each={plan.commercialLines} for:item="item"><article class="list-card" key={item.Id}><div><strong>{item.External_ID__c}</strong><span>{item.Description__c}</span></div><div><span>{item.Status__c}</span><small>{item.Acceptance_Status__c}</small></div></article></template></section></div>
                        <section class="panel"><div class="panel-heading"><div><p class="eyebrow">Invoice and collection milestones</p><h2>{paymentCount} contract payments</h2></div><div class="payment-total"><span>Outstanding</span><strong><lightning-formatted-number value={outstandingPaymentValue} format-style="currency" currency-code="INR" maximum-fraction-digits="0"></lightning-formatted-number></strong></div></div><template lwc:if={hasPayments}><div class="card-grid"><template for:each={plan.contractPayments} for:item="item"><article class="metric-card" key={item.Id}><div class="metric-card__head"><div><strong>{item.Payment_ID__c}</strong><span>{item.Milestone__c}</span></div><span class="status">{item.Status__c}</span></div><div class="metric-card__facts"><span>{item.Commercial_Reference__r.External_ID__c}</span><span>Due {item.Due_Date__c}</span><span><lightning-formatted-number value={item.Outstanding_Amount__c} format-style="currency" currency-code="INR" maximum-fraction-digits="0"></lightning-formatted-number> due</span></div></article></template></div></template><template lwc:else><div class="empty">No contract payment milestones are recorded.</div></template></section>
                        <template lwc:if={canManageProjects}>
                            <div class="two-column">
                                <section class="panel"><div class="panel-heading"><div><p class="eyebrow">Approved scope control</p><h2>Add amendment or change order</h2></div></div><div class="form-grid"><lightning-combobox label="Parent contract" value={commercialDraft.parentReferenceId} options={commercialReferenceOptions} data-field="parentReferenceId" onchange={handleCommercialDraft}></lightning-combobox><lightning-combobox label="Change type" value={commercialDraft.referenceType} options={commercialChangeTypeOptions} data-field="referenceType" onchange={handleCommercialDraft}></lightning-combobox><lightning-input label="Change ID" value={commercialDraft.externalId} data-field="externalId" onchange={handleCommercialDraft}></lightning-input><lightning-input type="number" label="Approved value" value={commercialDraft.value} data-field="value" onchange={handleCommercialDraft}></lightning-input><lightning-input type="date" label="Valid from" value={commercialDraft.validFrom} data-field="validFrom" onchange={handleCommercialDraft}></lightning-input><lightning-input type="date" label="Valid to" value={commercialDraft.validTo} data-field="validTo" onchange={handleCommercialDraft}></lightning-input><lightning-textarea class="span-3" label="Approved change reason" value={commercialDraft.changeReason} data-field="changeReason" onchange={handleCommercialDraft}></lightning-textarea></div><div class="button-row"><lightning-button variant="brand" label="Record approved change" onclick={handleCreateCommercialChange}></lightning-button></div></section>
                                <section class="panel"><div class="panel-heading"><div><p class="eyebrow">Deliverable traceability</p><h2>Add contract line</h2></div></div><div class="form-grid"><lightning-combobox label="Contract version" value={commercialLineDraft.referenceId} options={commercialReferenceOptions} data-field="referenceId" onchange={handleCommercialLineDraft}></lightning-combobox><lightning-combobox label="Line type" value={commercialLineDraft.lineType} options={commercialLineTypeOptions} data-field="lineType" onchange={handleCommercialLineDraft}></lightning-combobox><lightning-input label="Line ID" value={commercialLineDraft.externalId} data-field="externalId" onchange={handleCommercialLineDraft}></lightning-input><lightning-input class="span-3" label="Description" value={commercialLineDraft.description} data-field="description" onchange={handleCommercialLineDraft}></lightning-input><lightning-input type="number" label="Sequence" value={commercialLineDraft.sequence} data-field="sequence" onchange={handleCommercialLineDraft}></lightning-input><lightning-input type="number" label="Value" value={commercialLineDraft.value} data-field="value" onchange={handleCommercialLineDraft}></lightning-input><lightning-input type="date" label="Delivery date" value={commercialLineDraft.deliveryDate} data-field="deliveryDate" onchange={handleCommercialLineDraft}></lightning-input><lightning-combobox label="Linked WBS" value={commercialLineDraft.workUnitId} options={taskOptions} data-field="workUnitId" onchange={handleCommercialLineDraft}></lightning-combobox><lightning-input type="checkbox" label="Acceptance required" checked={commercialLineDraft.acceptanceRequired} data-field="acceptanceRequired" onchange={handleCommercialLineDraft}></lightning-input></div><div class="button-row"><lightning-button variant="brand" label="Add governed contract line" onclick={handleCreateCommercialLine}></lightning-button></div></section>
                            </div>
                        </template>
                    </lightning-tab>

                    <lightning-tab label="Risks & closeout" value="closeout">
                        <div class="two-column"><section class="panel"><div class="panel-heading"><div><p class="eyebrow">Accountable delivery control</p><h2>Risks and mitigations</h2></div></div><template lwc:if={hasRisks}><template for:each={plan.risks} for:item="risk"><button class="list-card list-card_button" key={risk.Id} data-id={risk.Id} onclick={handleRiskSelect}><div><strong>{risk.External_ID__c} · {risk.Title__c}</strong><span>{risk.Mitigation__c}</span></div><div><span>{risk.Severity__c}</span><small>{risk.Status__c}</small></div></button></template></template><div class="form-stack section-rule"><lightning-input label="Risk ID" value={riskDraft.externalId} data-field="externalId" onchange={handleRiskDraft}></lightning-input><lightning-input label="Title" value={riskDraft.title} data-field="title" onchange={handleRiskDraft}></lightning-input><lightning-textarea label="Description" value={riskDraft.description} data-field="description" onchange={handleRiskDraft}></lightning-textarea><lightning-combobox label="Severity" value={riskDraft.severity} options={severityOptions} data-field="severity" onchange={handleRiskDraft}></lightning-combobox><lightning-input type="date" label="Due date" value={riskDraft.dueDate} data-field="dueDate" onchange={handleRiskDraft}></lightning-input><lightning-textarea label="Mitigation" value={riskDraft.mitigation} data-field="mitigation" onchange={handleRiskDraft}></lightning-textarea></div><div class="button-row"><lightning-button variant="brand" label="Add risk" onclick={handleCreateRisk}></lightning-button><template lwc:if={selectedRisk}><lightning-button label="Close selected risk" onclick={handleCloseRisk}></lightning-button></template></div></section>
                            <section class="panel"><div class="panel-heading"><div><p class="eyebrow">Governed completion</p><h2>Closeout readiness</h2></div><span class="status">{closeoutStatus}</span></div><template lwc:if={closeoutReady}><div class="ready">All completion gates currently pass.</div></template><template lwc:else><ul class="blockers"><template for:each={gateBlockers} for:item="blocker"><li key={blocker}>{blocker}</li></template></ul></template><div class="form-stack section-rule"><lightning-input type="date" label="Completion date" value={closeoutDraft.completionDate} data-field="completionDate" onchange={handleCloseoutDraft}></lightning-input><lightning-textarea label="Lessons learned" value={closeoutDraft.lessonsLearned} data-field="lessonsLearned" onchange={handleCloseoutDraft}></lightning-textarea><lightning-textarea label="Customer acceptance evidence" value={closeoutDraft.customerAcceptanceNote} data-field="customerAcceptanceNote" onchange={handleCloseoutDraft}></lightning-textarea></div><div class="button-row"><lightning-button label="Save draft" onclick={handleSaveCloseout}></lightning-button><lightning-button variant="brand" label="Submit for independent approval" onclick={handleSubmitCloseout} disabled={busy}></lightning-button></div><template lwc:if={canApproveCloseout}><div class="form-stack section-rule"><p class="eyebrow">Independent portfolio decision</p><lightning-textarea label="Decision evidence" value={closeoutDecisionNote} onchange={handleCloseoutDecisionNote}></lightning-textarea><div class="button-row"><lightning-button variant="success" label="Approve project completion" data-approve="true" onclick={handleCloseoutDecision}></lightning-button><lightning-button variant="destructive-text" label="Reject closeout" data-approve="false" onclick={handleCloseoutDecision}></lightning-button></div></div></template></section></div>
                    </lightning-tab>
                </lightning-tabset>
            </template>
        </div>
    </lightning-card>
</template>
